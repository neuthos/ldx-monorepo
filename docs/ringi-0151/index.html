QA-001 answer", "BE ldx_addons/ldx_core/tests/test_sales_billing_invoice_type.py: test_master_type_edit_propagates_to_invoices"]}}, {"qa_id": "QA-005", "question": "T-010 performance: how many records should be used as \"large volume\", and what response time is acceptable (current level as baseline)?", "answer": "The download is limited to 2,000 records.", "ai_analyzed": true, "original_input": {"answer": "limit download 2000 data"}, "analysis": {"outcome": "updated", "summary": "The \"large volume\" for T-010 is bounded by the download limit, which the team sets at 2,000 records. In code this is the per-company res.company.download_limit (default 200,000; 0 = unlimited) enforced by validate_download_limit_by_len, so 2,000 is the team's environment setting, not a system constant. REQ-013 notes updated to say so; no response-time threshold was given, so REQ-013 stays not testable.", "req_refs": ["REQ-013"], "evidence": ["PRD \u00a74.4 Performance: Maintain current level", "PRD \u00a75 T-010", "QA-005 answer", "BE ldx_addons/ldx_core/base/res_company.py:download_limit (DEFAULT_DOWNLOAD_LIMIT = 200000; 0 = unlimited); ldx_addons/ldx_core/utils/validator.py:validate_download_limit_by_len", "DOC-001 \u00a73.4 / \u00a74 row-limit refusal message"]}}], "mom_notes": [], "supporting_docs": [{"doc_id": "DOC-001", "description": "LPEDIA page for the Invoice List screen (\u8acb\u6c42\u66f8\u4e00\u89a7, INV-060-013), verified against Backend v0.54.124 and Frontend v0.309.8 on 2026-09-02.", "text": "Invoice List\n\n\n\nBy Kenneth Nursalim\n\n25 min\n\nListen\n\nAdd a reaction\nScreen\n\n\u8acb\u6c42\u66f8\u4e00\u89a7 (Invoice List)\n\nScreen number\n\nINV-060-013\n\nWhere to find it\n\n\u5728\u5eab\u7ba1\u7406 (Inventory Control) \u2192 \u58f2\u4e0a\u30fb\u8acb\u6c42\u51e6\u7406 (Sales and Billing Process) \u2192 \u8acb\u6c42\u66f8\u4e00\u89a7 (Invoice List)\n\nOwner\n\nL-DX\n\nStatus\n\nDraft\n\nVerified against\n\nBackend v0.54.124 (development) + Frontend v0.309.8 (master), local development stack, on 2026-09-02\n\n1. What is this screen?\nThis screen lists every invoice (\u8acb\u6c42\u66f8) the company has issued \u2014 one row per invoice. A row appears the moment a billing (\u8acb\u6c42) to a billing destination is confirmed, and it shows the invoice's headline figures: what was carried over from the previous invoice, what the customer has paid, this period's sales, and the total being claimed. Staff who issue and check invoices use it to find an issued invoice, check those figures, open the invoice as the customer will see it, export the list to Excel, and request the invoice PDFs that go out to customers.\n\nIt is a read-and-download screen. Nothing here creates, edits, confirms or deletes an invoice \u2014 those actions belong to \u8acb\u6c42\u60c5\u5831\u4e00\u89a7 Billing Info List and \u8acb\u6c42\u60c5\u5831\u767b\u9332 Create Billing Detail (see \u00a73.8).\n\nPart of the Order-to-Cash flow \u2014 see that page for the end-to-end picture.\n\nWhere you are in the flow:\n\nFlow\n\nPosition\n\nOrder-to-Cash\n\n\u8acb\u6c42\u60c5\u5831\u767b\u9332 Create Billing Detail / \u8acb\u6c42\u60c5\u5831\u4e00\u89a7 Billing Info List \u2190 You are here \u2192 \u8acb\u6c42\u66f8\u30d7\u30ec\u30d3\u30e5\u30fc Invoice Preview\n\n2. Before you start\nPermissions. Internal users at every access level \u2014 view-only, editor and approver \u2014 see the identical screen with every button active, including [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download), the one action here that creates something (a PDF request and its files); this is described from the access configuration. Guest access: TBD \u2014 confirm at review; until it is settled, treat this screen as one for internal users. Without the menu entry the page shows the access-refused message listed in \u00a74.\n\nNote for reviewers: the neighbouring billing pages state that billing data is closed to guest accounts, while the access configuration read for this page defines no guest-specific narrowing. Whether a guest who holds the menu entry can open this list must be settled with a real guest login \u2014 the sentence above will be rewritten either way.\n\nPrerequisites. An invoice exists only after its billing has been confirmed \u2014 by hand on Billing Info List or Create Billing Detail, or automatically in the cases listed in the lifecycle chain below. The billings themselves are created in bulk on \u58f2\u639b\u91d1\u4e00\u89a7 Account Receivable List or one destination at a time on \u8acb\u6c42\u5148\u30fb\u5f97\u610f\u5148\u5225\u58f2\u639b\u91d1\u4e00\u89a7 Accounts Receivable List by Billing To and Customer.\n\nThe closing-period banner. When an accounting period is closed, the yellow banner \"Closing is currently in effect until 2026/05/31 and some editing function is locked.\" shows at the top of this screen, as on every other screen. It blocks nothing here: invoices dated inside the closed period still list, export and print (what the lock does affect is noted in the lifecycle chain below).\n\nPerformance. A search runs over every issued invoice \u2014 hundreds of thousands of rows in a mature system \u2014 so it can take a moment. Exporting the whole list shows only a spinner on the button \u2014 no progress bar \u2014 and can take a long time. A PDF request returns at once but the PDFs are produced in the background, one invoice at a time; opening the Download List and picking up a large merged PDF are the heavier steps. Request PDFs in reasonable batches rather than hundreds at a time.\n\nBilling lifecycle at a glance\nThe invoice has no status column of its own. Its life is the life of the billing behind it, and an invoice row exists on this screen exactly while that billing is confirmed:\n\nbilling created (Account Receivable List, or one destination at a time) \u2192 \n\u4e0b\u66f8\u304d DRAFT\n \u2014 \u8acb\u6c42\u78ba\u5b9a Billing Confirmation on Billing Info List or Create Billing Detail (needs the Approval level); automatic for billings created by Batch Create Billing on Account Receivable List, for prepayment invoices (\u524d\u6255) raised from an advance payment, and for cash-type destinations \u2192 \n\u78ba\u5b9a CONFIRMED \u2014 INVOICE ISSUED, ROW APPEARS HERE\n \u2014 \u524a\u9664 Delete the billing on Billing Info List (needs the Edit level), newest billing of that destination only \u2192 (row disappears)\n\nA draft billing can also be deleted before it is ever confirmed \u2014 it never reaches this list.\n\nThere is no un-confirm and no cancel. An issued invoice is corrected by deleting its billing, fixing the source slips and creating the billing again \u2014 never on this screen (\u00a73.8).\n\nBillings of one destination form a chain \u2014 each invoice starts from the previous one's balance \u2014 so only the newest billing of a destination can be deleted; and, as documented on \u8acb\u6c42\u60c5\u5831\u4e00\u89a7 Billing Info List, a billing dated in a closed accounting period cannot be deleted until the period is reopened. Both rules belong to that screen.\n\nA separate payment-confirmation status (\u5165\u91d1\u78ba\u5b9a) exists on the billing but is not shown here; see \u8acb\u6c42\u60c5\u5831\u767b\u9332 Create Billing Detail.\n\nWhat each state allows on this screen (search, export, PDF request) is tabulated in \u00a75 States and what each allows.\n\nPDF request lifecycle at a glance\nEach PDF request made with [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download) is a second, short-lived document, watched in the [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4e00\u89a7] (Download List) dialog (\u00a73.6). It moves by itself \u2014 no button on this screen changes its status:\n\n\u4fdd\u7559\u4e2d PENDING\n \u2014 request placed, PDF work not yet started (automatic) \u2192 \n\u9032\u884c\u4e2d STARTED\n \u2014 PDFs produced one invoice at a time (automatic) \u2192 \n\u5b8c\u4e86 DONE\n \u2014 [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download) offered on the row; \u9032\u884c\u4e2d \u2014 an error while producing a PDF \u2192 \n\u5931\u6557 FAILED\n\nA request whose invoices already have PDFs is \u5b8c\u4e86 at once (\u00a73.5).\n\nThere is no cancel and no retry on this screen: a request that is no longer wanted simply stays in the list, and a \u5931\u6557 (Failed) request is reported to your administrator with its date. A value \u53d6\u6d88 (Cancelled) exists in the system's vocabulary, but nothing on this screen produces it.\n\nThe status is blank when the request has no invoices behind it.\n\nWhat each status allows is tabulated in \u00a75 States and what each allows.\n\n\nDiagram source (Mermaid)\n3. Tasks\n3.1 Find invoices\nWhen: any time you need to locate an issued invoice \u2014 to check its figures, quote its number to a customer, or select rows for an Excel export or a PDF request.\n\nOpen the screen from the menu. Three filters are visible \u2014 \u8acb\u6c42\u66f8\u756a\u53f7 (Invoice No), \u8acb\u6c42\u5148 (Billing To) and \u639b\u58f2\uff0f\u524d\u6255 (Credit Sales/Prepayment) \u2014 and the list already shows every invoice, newest first. \n\nPress [\u958b\u304f] (Expand) to reveal the other six filters. \n\nFill any combination \u2014 no filter is required:\n\n\u9867\u5ba2\u3092\u8868\u793a (Display \u9867\u5ba2): untick it to hide the walk-in \u9867\u5ba2 account \u2014 every consumer sale bundled under one destination, which makes up the vast majority of rows \u2014 and see named destinations only. Tick the box again to bring those rows back.\n\n\u8acb\u6c42\u66f8\u756a\u53f7 (Invoice No) matches partially: 0038 finds every invoice whose number contains 0038. \n\n\u8acb\u6c42\u5148 (Billing To): click the field and type part of the code or the name. The list shows [code] name and includes archived destinations, so old invoices stay findable. \n\n\u639b\u58f2\uff0f\u524d\u6255 (Credit Sales/Prepayment): \u639b\u58f2 (Credit Sales) for ordinary invoices, \u524d\u6255 (Prepayment) for invoices raised from an advance payment (\u00a73.2). \n\nDate ranges: \u7d0d\u54c1\u65e5 (Delivery Date), \u8acb\u6c42\u30bf\u30a4\u30df\u30f3\u30b0 (Billing Timing) \u2014 which, despite its name, filters the \u8acb\u6c42\u65e5 (Billing Date) column \u2014 and \u7de0\u3081\u65e5 (Closing Date). Days inside a closed accounting period stay selectable. \n\nAmount ranges: \u524d\u56de\u3054\u8acb\u6c42\u91d1\u984d (Previous Billing Amount) and \u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d (Current Invoice Amount) each take a Minimum and a Maximum. If the Maximum you type is smaller than the Minimum, it is silently raised to the Minimum when you leave the field. \n\nPress [\u691c\u7d22] (Search). The list reloads on page 1 and the caption \"Total N items\" updates. There is no Clear button \u2014 blank the fields yourself or reload the screen; filters are not remembered between visits. \n\nPage through with the pager: 10 rows per page by default, selectable up to 500. The page number is kept in the address bar. \n\n\nResult: the matching invoices, always newest first \u2014 the columns cannot be sorted. Ticks are cleared whenever you page, search or change the page size, so anything you select for an export or a PDF request must sit on one page; raise the page size first if you need more than ten rows.\n\n3.2 Read an invoice row\nWhen: you want the headline figures of an invoice without opening it, or the four amounts on an old row no longer add up.\n\nFind the row (\u00a73.1) and scroll the table to the right for the four amount columns \u2014 the row itself is read-only. \n\n\nThe four amounts are the closing figures of the billing that produced the invoice, defined exactly as on the preview:\n\n\u524d\u56de\u8acb\u6c42\u91d1\u984d (Previous Billing Amount) \u2014 the \u3054\u8acb\u6c42\u91d1\u984d of this destination's previous invoice \u2014 the amount that invoice asked the customer to pay \u2014 carried into this one.\n\n\u3054\u5165\u91d1\u984d (Deposit Amount) \u2014 money received from the customer and recorded in this billing period, whatever it was paying for; refunds count negative.\n\n\u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d (Current Invoice Amount) \u2014 this period's own sales, tax included, less returns and credits.\n\n\u3054\u8acb\u6c42\u91d1\u984d (Billing Amount) \u2014 the number to tell the customer: \u524d\u56de\u8acb\u6c42\u91d1\u984d + \u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d \u2212 \u3054\u5165\u91d1\u984d.\n\n\u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d and \u3054\u8acb\u6c42\u91d1\u984d are fixed when the billing is confirmed, so the printed claim never changes. \u524d\u56de\u8acb\u6c42\u91d1\u984d and \u3054\u5165\u91d1\u984d are read from the billing each time the list is shown. A deposit recorded after this invoice was issued belongs to the next billing and does not change this row, so in normal operation the four figures always satisfy the identity in \u00a76. The only case in which they stop adding up is a re-valuation of the billing carried out on the system side after issue \u2014 a maintenance operation, not a screen action; the printed invoice always carries the fixed pair. Full definitions and worked examples are on Invoice Preview \u00a75 (rows 8, 9, 11 and 12) and Invoice Preview \u00a76; this list derives nothing of its own.\n\nNote for reviewers: Invoice Preview \u00a75 row 12 (and the Result line of its task 3.4) currently say that a deposit arriving after issuance moves the balance shown on screen; this page follows the verified behaviour \u2014 deposits are attached to the billing when it is created, so a later deposit belongs to the next billing. One of the two pages must change; please settle which before sign-off.\n\nHow the amounts look: whole yen with thousands separators and no currency symbol; a zero prints as 0; a cell is blank only when there is no value at all; negative amounts are red with a leading minus sign. A negative \u3054\u8acb\u6c42\u91d1\u984d means the customer is in credit \u2014 typically after a return. \n\n\u639b\u58f2\uff0f\u524d\u6255 (Credit Sales/Prepayment) tells you which kind of invoice the row is: \u639b\u58f2 (Credit Sales) is the ordinary invoice; \u524d\u6255 (Prepayment) is an invoice raised from a shipment that was set to advance payment. It is not the destination's invoice print type (\u8a73\u7d30\u7248, \u7c21\u6613\u7248 and the other layouts \u2014 a Billing To Master (link TBD: Billing To Master) setting that decides what the PDF looks like). Prepayment rows carry no carry-over and no deposit, so their \u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d and \u3054\u8acb\u6c42\u91d1\u984d are equal. \n\nResult: you can read the four amounts and tell the pair fixed at confirmation from the pair read from the billing, without opening the invoice.\n\n3.3 Open an invoice to see it as the customer will\nWhen: you need the line items, the tax summary, or the PDF of a single invoice.\n\nPress [\u8a73\u7d30] (Detail) \u2014 the second column of the row, pinned to the left edge. It is a link, so it can also be opened in a new browser tab.\n\nResult: \u8acb\u6c42\u66f8\u30d7\u30ec\u30d3\u30e5\u30fc Invoice Preview opens in issued-invoice mode with [\u4e00\u89a7\u3078\u623b\u308b] (Back To List), [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download) and [\u66f4\u65b0] (Update); what each does is described on that page. The preview also shows \u6b8b\u9ad8 (Balance), which this list does not. \n\n3.4 Download the list to Excel\nWhen: you need the invoices in a spreadsheet \u2014 offline reconciliation, a report attachment, a check against the customer's own records.\n\nFilter the list first \u2014 the export honours the current filters and takes every matching row, not just the page you see.\n\nWith nothing ticked the button reads [\u5168\u4ef6\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download All) and exports every matching row. Tick rows and it changes to [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download), which exports only the ticked rows \u2014 they must sit on the current page (\u00a73.1). \n\nWhen [\u5168\u4ef6\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download All) covers more than 1,000 rows a confirmation asks first: \"Downloading all records will affect the whole system's performance. Are you sure to proceed?\" \u2014 press [\u78ba\u5b9a] (Confirm) to go ahead, or [\u30ad\u30e3\u30f3\u30bb\u30eb] (Cancel) and narrow the filters. The dialog has no \u00d7 and does not close when you click outside it. Exports of 1,000 rows or fewer start straight away. \n\n\nWait while the button shows its spinner \u2014 the only progress indicator; a large export takes a while (performance note in \u00a72).\n\nResult: an Excel file in your browser's download folder, named {screen name}_YYYYMMDD_hhmm.xlsx with the screen name in your UI language \u2014 Invoice List_20260902_0258.xlsx in English, \u8acb\u6c42\u66f8\u4e00\u89a7_\u2026 in Japanese. It holds the twelve list columns in screen order with the same values, ordered newest first, and it includes the invoices of archived destinations. Three things differ from the screen: the last header reads \u4eca\u56de\u3054\u8acb\u6c42\u91d1\u984d (Current Billing Amount) \u2014 the same value as the on-screen \u3054\u8acb\u6c42\u91d1\u984d; dates are written as text in the form YYYY-MM-DD, on the same calendar day the screen shows; and \u639b\u58f2\uff0f\u524d\u6255 is written as the label of your UI language. Amounts are true numbers \u2014 negatives negative, zero as 0.\n\nExports above the row limit set for your company are refused; the message the system defines for this case is listed in \u00a74 \u2014 narrow the filters and try again. These exports are heavy on the system, which is why the limit and the confirmation exist.\n\n3.5 Request the invoice PDFs\nWhen: it is time to send invoices out and you want the PDFs of several invoices produced together.\n\nTick the invoices you need \u2014 the header checkbox ticks the whole page. [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download) is greyed out until at least one row is ticked. \n\n\nPress [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download). A green message appears: \"The file is currently downloading. Please wait a moment for it to complete\" (\u30d5\u30a1\u30a4\u30eb\u3092\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4e2d\u3067\u3059\u3002\u5b8c\u4e86\u307e\u3067\u3057\u3070\u3089\u304f\u304a\u5f85\u3061\u304f\u3060\u3055\u3044\u3002). \n\nNothing else on the screen changes: the rows stay ticked and no row shows a status. Your request now sits in the Download List \u2014 collect it as in \u00a73.6.\n\nResult: one request named \u4e00\u62ec\u8acb\u6c42\u4f5c\u6210 - YYYY-MM-DD (today's date in Japan time; the name stays in Japanese in the English UI). The PDFs are produced in the background, one invoice at a time \u2014 roughly a minute per invoice \u2014 with no progress indicator on this screen.\n\nWorth knowing:\n\nA PDF once produced is reused, never regenerated. Requesting an invoice that already has a PDF shows the same green message, and the new request is \u5b8c\u4e86 (Done) at once. The file shows the figures as they stood when it was first produced; if the billing is corrected afterwards the file is not refreshed, and no action on this screen regenerates it. \n\nInvoices whose destination is flagged \u4e00\u62ec\u8acb\u6c42\u66f8\u304b\u3089\u9664\u5916 (Exclude from Batch Invoice) on the Billing To Master (link TBD: Billing To Master) can be ticked and requested, but they are left out of the merged PDF (described from the system definition, not observed). When every invoice in a request belongs to such a destination, the request still reaches \u5b8c\u4e86 (Done), but pressing its [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download) does nothing (\u00a74).\n\nThe request is the only thing this screen ever writes. It never touches the invoice or the billing.\n\n3.6 Pick up a requested PDF\nWhen: a few minutes after a request, to collect the merged PDF.\n\nPress [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4e00\u89a7] (Download List). A dialog of the same name lists the requests made from this screen, newest first, with its own pager and, after an unlabelled leading column, four labelled columns: \u30d5\u30a1\u30a4\u30eb\u540d (File Name), \u30b9\u30c6\u30fc\u30bf\u30b9 (Status), \u30e6\u30fc\u30b6\u30fcID (User ID \u2014 the login of the person who made the request) and \u30a2\u30af\u30b7\u30e7\u30f3 (Action). It is refreshed every time you open it. \n\nRead the status. \u9032\u884c\u4e2d (Started) means the PDFs are still being produced and the Action cell is empty; when it turns \u5b8c\u4e86 (Done) the row shows [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download). To refresh, press [\u9589\u3058\u308b] (Close) and open the dialog again. Every status value is explained in the request-status table of \u00a75 States and what each allows, and the request's lifecycle is drawn in \u00a72.\n\nPress the row's [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download). The merged PDF opens in a new browser tab. If no tab appears, the browser may have blocked it as a pop-up \u2014 allow pop-ups for this site and press [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] again (every press rebuilds the merged file, so nothing is lost). \n\nResult: one PDF with the requested invoices, ordered by billing-destination code, named \u4e00\u62ec\u8acb\u6c42\u4f5c\u6210 YYYY_MM_DD - Combined, All.pdf. The date in that file name follows world standard time (UTC, nine hours behind Japan) rather than Japan time and is taken from the moment the request was made: a request placed between 00:00 and 09:00 (Japan time) yields a file dated the previous day while the Download List row shows today; the contents are unaffected. Each press of [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] re-assembles the bundle from the invoices' stored PDFs \u2014 the individual invoice PDFs themselves are never regenerated (\u00a73.5).\n\nIf a row stays at \u9032\u884c\u4e2d or \u4fdd\u7559\u4e2d for a long time, the system has not finished \u2014 or not started \u2014 producing the PDFs: close the dialog, wait, and reopen it; if it never moves, contact your administrator. If a row shows \u5b8c\u4e86 but [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] does nothing, see \u00a74.\n\n3.7 Come back to the list from an invoice\nWhen: you opened an invoice from this list and want to continue searching.\n\nOn Invoice Preview press [\u4e00\u89a7\u3078\u623b\u308b] (Back To List), top left \u2014 it appears only when the preview was opened from this list. \n\nResult: the list reloads without your previous search \u2014 every filter is cleared, \u9867\u5ba2\u3092\u8868\u793a (Display \u9867\u5ba2) is ticked again, and page 1 of the full list is shown. Re-enter your search terms. This is product-wide behaviour, also noted on Invoice Preview \u00a73.5.\n\n3.8 Understand what appears here and where to act on an invoice\nWhen: an invoice you expect is missing, an issued invoice is wrong, or you need to remove one.\n\nCheck the billing's status on \u8acb\u6c42\u60c5\u5831\u4e00\u89a7 Billing Info List \u2014 the cases below tell you which screen to act on.\n\nOnly confirmed billings become invoices. \u8acb\u6c42\u60c5\u5831\u4e00\u89a7 Billing Info List shows every billing from the moment it is created; this list shows it from the moment it is confirmed. A billing you can see there but not here has simply not been confirmed yet.\n\nSome invoices arrive by themselves \u2014 the billings that are confirmed automatically are listed in the lifecycle chain in \u00a72.\n\nTo correct an issued invoice, delete its billing on Billing Info List \u2014 the rules on which billing can be deleted are in \u00a72 \u2014 correct the source slips, and create and confirm the billing again. Nothing on this screen deletes, edits or re-numbers an invoice, and the two fixed amounts are never refreshed in place \u2014 see Invoice Preview \u00a73.6.\n\nArchived destinations keep their invoices \u2014 see the Archival note in \u00a75.\n\nBulk registration lives on the billing side, not here. Most billings are created together by \u4e00\u62ec\u8acb\u6c42\u4f5c\u6210 Batch Create Billing on Account Receivable List; a file-import screen, Billing Info Batch Registration (link TBD: Billing Info Batch Registration) (\u8acb\u6c42\u60c5\u5831\u4e00\u62ec\u767b\u9332), exists without a menu entry and is used for system-led migrations; it will have its own page. Invoices themselves have no batch screen: the closest thing on this list is the PDF request, which acts on many invoices at once.\n\nResult: you know which sibling screen to go to \u2014 nothing on this list itself needs to change.\n\n4. Errors & messages\nMessage (as shown)\n\nWhen it appears\n\nWhat to do\n\nClosing is currently in effect until 2026/05/31 and some editing function is locked. (2026/05/31\u307e\u3067\u7de0\u3081\u304c\u5b9f\u884c\u3055\u308c\u3066\u304a\u308a\u3001\u7de8\u96c6\u304c\u30ed\u30c3\u30af\u3055\u308c\u3066\u3044\u307e\u3059\u3002)\n\nYellow banner on every page while an accounting period is closed; the date is your company's closing date\n\nNothing \u2014 no action on this screen is blocked by the closing period\n\nConfirmation \u2014 Downloading all records will affect the whole system's performance. Are you sure to proceed? (\u78ba\u8a8d \u2014 \u5168\u4ef6\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u3092\u4f7f\u3046\u3068\u30b7\u30b9\u30c6\u30e0\u304c\u5168\u4f53\u7684\u306b\u9045\u304f\u306a\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002\u672c\u5f53\u306b\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u3057\u307e\u3059\u304b\uff1f)\n\n[\u5168\u4ef6\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download All) with more than 1,000 matching rows\n\n[\u78ba\u5b9a] (Confirm) to export, or [\u30ad\u30e3\u30f3\u30bb\u30eb] (Cancel) and narrow the filters\n\nThe file is currently downloading. Please wait a moment for it to complete (\u30d5\u30a1\u30a4\u30eb\u3092\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4e2d\u3067\u3059\u3002\u5b8c\u4e86\u307e\u3067\u3057\u3070\u3089\u304f\u304a\u5f85\u3061\u304f\u3060\u3055\u3044\u3002)\n\nAfter [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download)\n\nThe request is queued \u2014 collect it from [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4e00\u89a7] (Download List) once it shows \u5b8c\u4e86 (Done)\n\nWe apologize for the inconvenience. The maximum number of items available for download is [limit]. Currently, [count] items match your search criteria. Please refine your search parameters and try again. (\u6050\u308c\u5165\u308a\u307e\u3059\u3002\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u53ef\u80fd\u306a\u4ef6\u6570\u306f[limit]\u4ef6\u307e\u3067\u3067\u3059\u3002\u73fe\u5728[count]\u4ef6\u304c\u5bfe\u8c61\u3068\u306a\u3063\u3066\u3044\u307e\u3059\u3002\u5927\u5909\u304a\u624b\u6570\u3067\u3059\u304c\u3001\u691c\u7d22\u6761\u4ef6\u3092\u7d5e\u308a\u8fbc\u307f\u3001\u518d\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002)\n\nAn Excel export larger than the row limit set for your company; the message states the limit and the matching count (quoted from the system definition)\n\nNarrow the filters and export again\n\nYou are not allowed to access this page. Contact your administrator to request access if necessary. (\u3053\u306e\u30da\u30fc\u30b8\u3078\u306e\u30a2\u30af\u30bb\u30b9\u306f\u8a31\u53ef\u3055\u308c\u3066\u3044\u307e\u305b\u3093\u3002\u7ba1\u7406\u8005\u306b\u9023\u7d61\u3057\u3066\u30a2\u30af\u30bb\u30b9\u6a29\u9650\u3092\u30ea\u30af\u30a8\u30b9\u30c8\u3057\u3066\u304f\u3060\u3055\u3044\u3002)\n\nOpening the screen without the menu entry\n\nAsk your administrator for access to this screen\n\n\u2014 no message; nothing happens \u2014\n\n[\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9] (Download) on a Download List row that shows \u5b8c\u4e86 (Done) but whose invoices all belong to destinations flagged \u4e00\u62ec\u8acb\u6c42\u66f8\u304b\u3089\u9664\u5916 (Exclude from Batch Invoice)\n\nKnown issue \u2014 the merged file cannot be built and the screen stays silent. Request invoices of other destinations instead, and report the request's date to your administrator\n\nNote for reviewers: the row-limit refusal (fourth row) could not be reproduced \u2014 the company limit on the verified build was far above the number of invoices \u2014 so its message is quoted from the system definition. Please confirm that the current build displays it before sign-off; if it does not, that row and the matching sentence in \u00a73.4 will be reworded.\n\n5. Fields & filters\nEvery filter, column and button below is numbered to match the badge screenshots; the numbers run continuously from the filter panel (1\u20139) through the list columns (10\u201323) and the buttons (24\u201330) to the Download List dialog (columns 31\u201335, buttons 36\u201337).\n\nStates and what each allows \u2014 the invoice carries no status of its own; the billing's status decides everything (\u4e0b\u66f8\u304d \u2192(\u8acb\u6c42\u78ba\u5b9a, on the billing screens)\u2192 \u78ba\u5b9a; no un-confirm \u2014 see the lifecycle diagram):\n\nBilling status\n\nRow on this list\n\nSearch, read, open the preview\n\nEdit\n\nDelete\n\nConfirm\n\nRequest or pick up the PDF\n\nExport to Excel\n\n\u4e0b\u66f8\u304d (Draft)\n\n\u274c not listed\n\n\u2014\n\n\u2014\n\n\u2705 on Billing Info List (rules in \u00a72)\n\n\u2705 on Billing Info List / Create Billing Detail\n\n\u274c\n\n\u274c\n\n\u78ba\u5b9a (Confirmed)\n\n\u2705\n\n\u2705\n\n\u274c no editable control exists\n\n\u274c here \u2014 \u2705 on Billing Info List (rules in \u00a72)\n\n\u274c already confirmed\n\n\u2705\n\n\u2705\n\nThe second axis is the PDF request made with [\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u4f9d\u983c] (Request Download) \u2014 a short-lived document of its own, watched in the Download List dialog (\u4fdd\u7559\u4e2d \u2192 \u9032\u884c\u4e2d \u2192 \u5b8c\u4e86, or \u9032\u884c\u4e2d \u2192 \u5931\u6557; no cancel and no retry \u2014 see the PDF request diagram). Labels as shown in the dialog's \u30b9\u30c6\u30fc\u30bf\u30b9 (Status) column:\n\nRequest status (\u30b9\u30c6\u30fc\u30bf\u30b9)\n\nWhat it means\n\nPick up the merged PDF ([\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9])\n\nCancel or retry on this screen\n\n\u4fdd\u7559\u4e2d (Pending)\n\nRequest placed; PDF work not yet started\n\n\u274c\n\n\u274c no control\n\n\u9032\u884c\u4e2d (Started)\n\nPDFs being produced, one invoice at a time\n\n\u274c\n\n\u274c no control\n\n\u5b8c\u4e86 (Done)\n\nEvery PDF ready \u2014 pick the bundle up\n\n\u2705\n\n\u2014\n\n\u5931\u6557 (Failed)\n\nAn error while producing a PDF \u2014 report the request's date to your administrator\n\n\u274c\n\n\u274c no control \u2014 place a new request\n\n\u53d6\u6d88 (Cancelled)\n\nDefined in the system's vocabulary; nothing on this screen produces it\n\n\u274c\n\n\u2014\n\n(blank)\n\nThe request has no invoices behind it\n\n\u274c\n\n\u2014\n\nClosing period: no effect on this screen. Invoices dated in a closed period still list, filter, export and print; the three date filters deliberately allow closed days. The one thing the lock blocks \u2014 deleting such a billing \u2014 is a Billing Info List rule (\u00a72).\n\nArchival: invoices are never archived \u2014 they exist until their billing is deleted. The one master this screen draws on, the Billing To Master, can be archived: existing invoices keep showing the archived destination (code with an _archived suffix), the \u8acb\u6c42\u5148 (Billing To) filter still offers it, and the export includes it. Registering a new document for an archived destination does not arise here \u2014 nothing is registered on this screen; whether a new billing can be raised for an archived destination is a rule of the billing screens (see Terminology for the principle: past data stays visible, new registration is refused).\n\nTimezone: dates are entered and shown as calendar days in Japan time; a one-day range returns exactly that day, and the Excel export writes the same day. One known deviation: the merged PDF's file name follows UTC and is taken from the moment the request was made (\u00a73.6).\n\nLabel pairs that name one value: filter \u524d\u56de\u3054\u8acb\u6c42\u91d1\u984d and column \u524d\u56de\u8acb\u6c42\u91d1\u984d; on-screen \u3054\u8acb\u6c42\u91d1\u984d and Excel header \u4eca\u56de\u3054\u8acb\u6c42\u91d1\u984d. Each is quoted as it appears.\n\nFilters\n\nThe panel shows filters 1\u20133; [\u958b\u304f] (Expand) reveals 4\u20139. The one selector, \u8acb\u6c42\u5148 (Billing To), shows code and name together. The English label of filter 9 keeps the Japanese word \u9867\u5ba2.\n\n#\n\nFilter (on-screen label)\n\nWhat it means\n\nValue comes from\n\nNotes\n\n1\n\nInvoice No (\u8acb\u6c42\u66f8\u756a\u53f7)\n\nThe invoice's own number, as printed on the PDF\n\nentered\n\nPartial match; how the number is built is explained on column 12\n\n2\n\nBilling To (\u8acb\u6c42\u5148)\n\nThe destination the invoice is addressed to\n\nentered (picker over the Billing To Master, shown as [code] name)\n\nType part of the code or name; up to 20 matches are listed at a time; archived destinations are included so old invoices stay findable\n\n3\n\nCredit Sales/Prepayment (\u639b\u58f2\uff0f\u524d\u6255)\n\nOrdinary invoice, or one raised from an advance payment\n\nentered\n\nValues \u639b\u58f2 (Credit Sales) / \u524d\u6255 (Prepayment) \u2014 not the invoice print type; see \u00a73.2\n\n4\n\nDelivery Date (\u7d0d\u54c1\u65e5)\n\nThe delivery date carried onto the invoice\n\nentered (date range)\n\nBlank on most invoices, so a date here excludes them; closed-period days remain selectable\n\n5\n\nBilling Timing (\u8acb\u6c42\u30bf\u30a4\u30df\u30f3\u30b0)\n\n\u26a0\ufe0f Despite the name, filters the Billing Date column (18) \u2014 the \"as of\" date of the invoice\n\nentered (date range)\n\nMatches whole calendar days\n\n6\n\nClosing Date (\u7de0\u3081\u65e5)\n\nThe cut-off date of the period the invoice covers\n\nentered (date range)\n\nA destination can close twice a month, so two invoices of one destination can share a month with different closing dates\n\n7\n\nPrevious Billing Amount (\u524d\u56de\u3054\u8acb\u6c42\u91d1\u984d)\n\nRange search on the carry-over column (20)\n\nentered (Minimum / Maximum)\n\nSame value as column 20, whose header is spelled \u524d\u56de\u8acb\u6c42\u91d1\u984d. A Maximum below the Minimum is raised to it silently\n\n8\n\nCurrent Invoice Amount (\u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d)\n\nRange search on this period's sales column (22)\n\nentered (Minimum / Maximum)\n\nSame silent correction as filter 7\n\n9\n\nDisplay \u9867\u5ba2 (\u9867\u5ba2\u3092\u8868\u793a)\n\nShow or hide the invoices of the walk-in \u9867\u5ba2 account\n\nentered (checkbox, ticked by default)\n\nUntick to see named destinations only (\u00a73.1)\n\nList columns\n\n\nRow order and sorting are described in \u00a73.1. Columns 20\u201323 are one family \u2014 the billing's closing figures \u2014 read together in \u00a73.2 and defined on Invoice Preview \u00a75. Each column header carries pin and hide icons, and the header checkbox's caret menu offers \u5217\u306e\u8868\u793a\u8a2d\u5b9a (Column Visibility); the layout you choose is remembered in your browser. \n\n#\n\nColumn (on-screen header)\n\nWhat it means\n\nValue comes from\n\nNotes\n\n10\n\n(selection checkbox)\n\nSelects rows on the current page for the Excel export and the PDF request\n\nentered (tick)\n\nThe header box ticks the whole page. Ticks are cleared on paging or searching and have no totals role\n\n11\n\nDetail (\u8a73\u7d30)\n\nOpens the invoice on Invoice Preview (\u00a73.3)\n\nsystem (row link)\n\nPinned to the left edge, second column\n\n12\n\nInvoice No (\u8acb\u6c42\u66f8\u756a\u53f7)\n\nThe invoice number\n\nsystem \u2014 numbered when the billing is created: B- + the creation date in Japan time + a daily counter\n\nThe date part is the day the billing was created, so it can differ from the Billing Date\n\n13\n\nBilling To Code (\u8acb\u6c42\u5148\u30b3\u30fc\u30c9)\n\nThe destination's code\n\nBilling To Master \u2192 code\n\nArchived destinations print with an _archived suffix\n\n14\n\nBilling To (\u8acb\u6c42\u5148)\n\nThe destination's name\n\nBilling To Master \u2192 name\n\n\u2014\n\n15\n\nCredit Sales/Prepayment (\u639b\u58f2\uff0f\u524d\u6255)\n\n\u639b\u58f2 (Credit Sales) ordinary invoice / \u524d\u6255 (Prepayment) raised from an advance payment\n\nsystem \u2014 set to \u524d\u6255 when the invoice comes from an advance-payment entry\n\nSee \u00a73.2. Older documents call this column \u8acb\u6c42\u66f8\u7a2e\u5225\n\n16\n\nCurrency (\u901a\u8ca8\u7a2e\u5225)\n\nThe invoice currency\n\nthe billing's currency\n\nJPY on every invoice today\n\n17\n\nDelivery Date (\u7d0d\u54c1\u65e5)\n\nThe delivery date printed on the invoice\n\nthe billing's shipment delivery date, fixed at confirmation\n\nUsually blank. In the Japanese UI this column prints as 2025-08-19 while the other dates use slashes \u2014 a known display inconsistency\n\n18\n\nBilling Date (\u8acb\u6c42\u65e5)\n\nThe invoice date \u2014 the day the claim is made as of, printed as \u8acb\u6c42\u65e5 on the invoice; not the day the billing record was created (that day is in the invoice number, column 12)\n\nthe billing's billing date, read from the billing\n\nFilter 5 searches this column\n\n19\n\nClosing Date (\u7de0\u3081\u65e5)\n\nThe cut-off of the period the invoice covers\n\nthe billing's invoice closing date, read from the billing\n\nUsually the same day as the Billing Date. The two differ when a billing is raised before its cycle's closing day \u2014 a mid-cycle billing for a destination that closes at month-end, or a prepayment invoice \u2014 and the Closing Date then still shows the cycle's cut-off\n\n20\n\nPrevious Billing Amount (\u524d\u56de\u8acb\u6c42\u91d1\u984d)\n\nThe \u3054\u8acb\u6c42\u91d1\u984d of this destination's previous invoice \u2014 the amount that invoice asked the customer to pay \u2014 carried into this one\n\nthe previous invoice's \u3054\u8acb\u6c42\u91d1\u984d, read from the billing\n\n0 for prepayment invoices and for the walk-in \u9867\u5ba2 account. The filter spells it \u524d\u56de\u3054\u8acb\u6c42\u91d1\u984d. Definition: Invoice Preview \u00a75 row 8\n\n21\n\nDeposit Amount (\u3054\u5165\u91d1\u984d)\n\nMoney received during this period \u2014 deposits, payment adjustments and advance payments, refunds counted negative\n\nthe deposits registered against the billing, read from the billing \u2014 for example on \u58f2\u639b\u91d1\u5165\u91d1\u4e00\u62ec\u767b\u9332 Account Receivable Deposit Batch Registration\n\nDefinition: Invoice Preview \u00a75 row 9\n\n22\n\nCurrent Invoice Amount (\u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d)\n\nThis period's sales, tax included, less returns and credits\n\nthe billing's receivable for the period, fixed at confirmation\n\nDefinition: Invoice Preview \u00a75 row 11\n\n23\n\nBilling Amount (\u3054\u8acb\u6c42\u91d1\u984d)\n\nThe total claimed on the invoice\n\n= \u524d\u56de\u8acb\u6c42\u91d1\u984d + \u4eca\u56de\u8acb\u6c42\u66f8\u91d1\u984d \u2212 \u3054\u5165\u91d1\u984d, fixed at confirmation (\u00a76)\n\nRed when negative (customer in credit). Excel header: \u4eca\u56de\u3054\u8acb\u6c42\u91d1\u984d (Current Billing Amount). Definition: Invoice Preview \u00a75 row 12\n\nDownload List columns\n\nThe dialog has its own pager and five columns \u2014 an unlabelled leading column followed by four labelled ones. The request's status values and what each allows are tabulated once, in States and what each allows at the top of this section; the chain is drawn in \u00a72.\n\n#\n\nColumn (on-screen header)\n\nWhat it means\n\nValue comes from\n\nNotes\n\n31\n\n(unlabelled leading column \u2014 \u2295 in the header)\n\nThe \u2295 opens \u5217\u306e\u8868\u793a\u8a2d\u5b9a (Column Visibility) for the dialog's own columns; the cells below it are empty \u2014 rows are not ticked in this d         else if (k === 'html') node.innerHTML = v; /* static strings only, never data */
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);

          el('td', { text: x.prd_says }),
          el('td', { text: x.code_shows }),
          el('td', { class: 'mono', text: (x.linked_tms || []).join(', ') })));
      });
      root.appendChild(el('div', { class: 'tablewrap' }, el('table', { class: 'tbl' },
        el('thead', {}, el('tr', {}, el('th', { text: 'ID' }), el('th', { text: 'Where' }), el('th', { text: 'PRD says' }), el('th', { text: 'Code shows' }), el('th', { text: 'Linked TMs' }))),
        tb)));
    } else root.appendChild(el('div', { class: 'empty', text: 'No expected changes recorded.' }));

    var hc = S.design.heuristic_checklist || [];
    root.appendChild(el('h2', { class: 'section', text: 'Heuristic checklist' }, el('span', { class: 'section-meta', text: (counts.heuristic_checklist ? counts.heuristic_checklist.applied + ' applied · ' + counts.heuristic_checklist.na + ' na · ' + counts.heuristic_checklist.deferred + ' deferred' : '') })));
    if (hc.length) {
      var htb = el('tbody');
      hc.forEach(function (h) {
        htb.appendChild(el('tr', {},
          el('td', { class: 'mono', text: h.hc_id }),
          el('td', { text: h.heuristic }),
          el('td', {}, pill(h.status, HC_TONE[h.status])),
          el('td', { text: h.evidence })));
      });
      root.appendChild(el('div', { class: 'tablewrap' }, el('table', { class: 'tbl' },
        el('thead', {}, el('tr', {}, el('th', { text: 'HC' }), el('th', { text: 'Heuristic' }), el('th', { text: 'Status' }), el('th', { text: 'Evidence' }))),
        htb)));
    } else root.appendChild(el('div', { class: 'empty', text: 'No checklist recorded.' }));
  }

  /* ---------- shell wiring ---------- */
  function renderNavCounts() {
    document.querySelectorAll('.nav-item .nav-count').forEach(function (n) { n.remove(); });
    if (!S.req) return;
    var open = openAmbCount();
    if (open > 0) {
      var reqBtn = document.querySelector('.nav-item[data-view="req"]');
      if (reqBtn) reqBtn.appendChild(pill(String(open), 'warning', open + ' unanswered ambiguities')).classList.add('nav-count');
    }
  }
  function mount() {
    var host = $('#view');
    host.textContent = '';
    var frag = document.createDocumentFragment();
    if (S.view === 'req') viewReq(frag);
    else if (S.view === 'tm') viewTm(frag);
    else if (S.view === 'tc') viewTc(frag);
    else viewAudit(frag);
    host.appendChild(frag);
    document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('is-active', b.dataset.view === S.view); });
    $('#sheet').scrollTop = 0;
  }
  function normalizeReq(req) {
    (req.requirements || []).forEach(function (r) { if (!('notes' in r)) r.notes = ''; });
    INPUT_BUCKETS.forEach(function (bucket) {
      if (!Array.isArray(req[bucket])) req[bucket] = [];
      req[bucket].forEach(function (item) { item.ai_analyzed = item.ai_analyzed === true; });
    });
    return req;
  }
  /* Refresh must show what was saved: when served, the live files win over the
     embedded snapshot; the embed stays the fallback for file:// use. */
  function initData(done) {
    var useEmbedded = function () {
      S.req = normalizeReq(JSON.parse(JSON.stringify(DATA.requirements || { meta: {}, requirements: [], ambiguities: [] })));
      S.design = DATA.design || null;
      done();
    };
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return useEmbedded();
    fetch('requirements.json', { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (json) {
        S.req = normalizeReq(json);
        fetch('design.json', { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : null; })
          .catch(function () { return null; })
          .then(function (design) { S.design = design || DATA.design || null; done(); });
      })
      .catch(useEmbedded);
  }
  function init() {
    var nav = $('#navlist');
    VIEWS.forEach(function (v) {
      nav.appendChild(el('button', { class: 'nav-item', type: 'button', 'data-view': v.id, title: v.label, onclick: function () { S.view = v.id; mount(); } },
        navIcon(v.icon), el('span', { class: 'nav-lbl', text: v.label })));
    });
    $('#nav-toggle').addEventListener('click', function () {
      var collapsed = $('#app').classList.toggle('nav-collapsed');
      this.setAttribute('aria-label', collapsed ? 'Expand navigation' : 'Collapse navigation');
      this.title = collapsed ? 'Expand navigation' : 'Collapse navigation';
      try { localStorage.setItem('ptk-nav', collapsed ? 'collapsed' : 'open'); } catch (e) { /* file:// or blocked storage */ }
    });
    try { if (localStorage.getItem('ptk-nav') === 'collapsed') $('#app').classList.add('nav-collapsed'); } catch (e) { /* ignore */ }
    if (!DATA) {
      $('#view').appendChild(el('div', { class: 'empty', text: 'No payload embedded. Render this page through the prd-testkit skill (assets/template.html).' }));
      $('#btn-save').disabled = true;
      return;
    }
    document.title = DATA.prd_name + ' — PRD Test Kit';
    $('#crumb').textContent = DATA.docs_dir;
    $('#nav-foot').textContent = DATA.prd_name;
    if (location.protocol === 'file:') {
      $('#serve-cmd').textContent = 'python3 .agents/skills/prd-testkit/scripts/serve.py ' + DATA.docs_dir + ' 8765';
      $('#serve-url').textContent = 'http://127.0.0.1:8765/index.html';
      $('#serve-banner').hidden = false;
    }
    $('#btn-save').addEventListener('click', save);
    initData(function () { renderNavCounts(); mount(); });
  }
  init();
})();
</script>
</body>
</html>
