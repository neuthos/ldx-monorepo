    <style id="theme">
      /* prd-testkit theme — "framed-sheet" dealt by design-taste-frontend (seed 1426014804)
   Move: one tinted frame holds the header and the tab row with no rule between them;
   the work sits on a white sheet with a 1px edge and 16px corners, no shadow.
   Accent (#1b6c80) is budgeted to the active tab underline, modal section titles and focus. */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#131416; --mut:#5d5f60; --line:#e8eaec; --bg:#f9fbfc; --acc:#1b6c80;
  --ok:#1e7b4f; --warn:#92400e; --bad:#c4242a; --chipbg:#ebedee;
  --rule:#f0f1f2; --control:#cdced1; --raised:#f4f6f8;
}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
table{font-variant-numeric:tabular-nums}

/* frame: header + tabs share the tinted ground, seam invisible */
header{background:var(--bg);border-bottom:1px solid var(--bg)}
header h1{font-weight:600}
nav{background:var(--bg);border-bottom:1px solid var(--line);padding:0 18px}
nav button{border-radius:0;padding:9px 16px 11px;font-weight:500;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}

/* work on a white sheet */
main{background:#fff;border:1px solid var(--line);border-radius:16px;margin:16px auto 40px;padding:20px 24px 44px}
@media(max-width:640px){main{margin:8px 8px 24px;padding:14px 14px 32px;border-radius:12px}}

/* tables: rules and alignment, no card, no header band */
main{overflow-x:clip}
table{background:transparent;border:none;border-radius:0;display:block;overflow-x:auto;max-width:100%}
th{background:#fff;color:var(--mut);font-weight:500;letter-spacing:0;border-bottom:1px solid var(--line)}
th,td{border-bottom:1px solid var(--rule)}
td.id,td.ctr{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--mut)}
h2.tab-title{font-weight:600}

/* chips: neutral for categories, pale tint pairs for status only */
.chip{background:var(--chipbg);color:#353736;font-weight:500;padding:2px 9px}
.chip.flow,.chip.validation,.chip.business-rule,.chip.permission,.chip.non-functional,.chip.constraint{background:#ebedee;color:#353736}
.chip.yes,.chip.applied{background:#dcfae5;color:#04250e}
.chip.no{background:#ffedea;color:#831c1e}
.chip.P0,.chip.H{background:#ffedea;color:#831c1e}
.chip.P1,.chip.M,.chip.deferred{background:#fffbeb;color:#92400e}
.chip.P2,.chip.P3,.chip.L,.chip.na{background:#ebedee;color:#353736}

/* controls: white with a 1px border, near-black primary */
button{border-radius:6px;border-color:var(--control);font-weight:500}
button:hover{border-color:#a9aeb4;color:var(--ink);background:#fff}
button.primary{background:#131416;border-color:#131416;color:#fff}
button.primary:hover{background:#2a2d30;opacity:1;color:#fff}
input,select,textarea{border-color:var(--control);border-radius:6px;background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* what floats may have a shadow */
#modal .card{border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(19,20,22,.16)}
#modal h3{color:var(--acc)}
.note{background:var(--raised);border-color:var(--control);color:var(--mut)}

    </style>

d INV-DD do not appear in the filtered file","Zero-match control: download returns HTTP 200 with a header row and zero data rows, mirroring the empty screen"],"example_table":[{"domain":"super_simple","screen_rows":1,"file_rows":1,"file_invoice_types":["super_simple"]},{"domain":"credit_card","screen_rows":0,"file_rows":0,"file_invoice_types":[]}]},{"ak_id":"AK-003","tc_id":"TC-Auto-INV-016","why":"Requires three DB population states and option-set assertions at each state","prep":["State A: fresh transaction with zero billing.to.master rows carrying an Invoice Type (archive or do not create any)","State B: create one master with invoice_print_type=simple","State C: add masters so all seven values are set across records"],"execution":["In each state, read the option values the Invoice List filter exposes (selection surface for sales_billing_to_invoice_type)","Compute the distinct set of invoice_print_type values present on billing.to.master"],"assertions":["State A: option set contains no Invoice Type value (0 typed masters -> nothing selectable)","State B: option set == {simple}","State C: option set == {detailed, simple, direct_debit, credit_card, envelope, envelope_simple, super_simple} with no duplicates","No state ever exposes a value absent from billing.to.master rows"],"example_table":[{"state":"A_0_masters","typed_master_values":0,"options_count":0,"options":[]},{"state":"B_1_master","typed_master_values":1,"options_count":1,"options":["simple"]},{"state":"C_many","typed_master_values":7,"options_count":7,"options":["detailed","simple","direct_debit","credit_card","envelope","envelope_simple","super_simple"]}]},{"ak_id":"AK-004","tc_id":"TC-Auto-INV-017","why":"Multi-step write/flush/read sequence verifying options and rows move together after a master edit","prep":["Create master BTM-X (invoice_print_type=super_simple) and invoice INV-X via sales.billing._action_create_sales_bill_invoice()"],"execution":["Write BTM-X.invoice_print_type = 'direct_debit'; flush","Read INV-X.sales_billing_to_invoice_type; re-read the filter option membership","ORM search [('sales_billing_to_invoice_type','=','super_simple')] and [('sales_billing_to_invoice_type','=','direct_debit')]"],"assertions":["INV-X reads direct_debit after the edit (relation by id, AMB-003)","Search by super_simple excludes INV-X; search by direct_debit includes INV-X","Option membership and row value agree on the same current master value"],"example_table":[{"step":"before edit","master_type":"super_simple","inv_x_type":"super_simple","search_super_simple_hits":1,"search_direct_debit_hits":0},{"step":"after edit","master_type":"direct_debit","inv_x_type":"direct_debit","search_super_simple_hits":0,"search_direct_debit_hits":1}]},{"ak_id":"AK-005","tc_id":"TC-Auto-INV-018","why":"Two-locale, two-surface parity matrix per Invoice Number","prep":["Seed masters super_simple and detailed with one invoice each","Activate ja_JP (lang install + terms load) alongside en_US"],"execution":["en_US: search_read values per invoice, then download_excel with en convert labels; build pairs","ja_JP: repeat with lang=ja_JP context and ja convert labels","Compare screen value vs file cell per Invoice Number per locale"],"assertions":["For every Invoice Number and locale: file cell == screen value (equality of the displayed label)","Locale change changes both surfaces consistently (no row where only one surface switches label)","Values are the localized labels in the active locale, never a raw mismatched-locale label"],"example_table":[{"locale":"en_US","invoice":"INV-SS","screen_value":"super_simple label (en)","file_cell":"same as screen","match":true},{"locale":"ja_JP","invoice":"INV-SS","screen_value":"super_simple label (ja)","file_cell":"same as screen","match":true}]},{"ak_id":"AK-006","tc_id":"TC-Auto-INV-027","why":"Three-mutation sequence with DB-level recompute assertions (edit, reassign, clear)","prep":["Create BTM-P (super_simple) and BTM-Q (detailed)","Create billing under BTM-P; generate invoice INV-P"],"execution":["Variant 1: BTM-P.invoice_print_type = 'direct_debit'; flush; read INV-P","Variant 2: billing.billing_to_master_id = BTM-Q; flush; read INV-P; then BTM-P.invoice_print_type = 'credit_card'; flush; read INV-P","Variant 3: BTM-Q.invoice_print_type = False; flush; read INV-P"],"assertions":["Variant 1: INV-P == direct_debit (current master value, AMB-003)","Variant 2: INV-P == detailed; stays detailed after the old master's later edit (no leak)","Variant 3: INV-P is False -> displays blank (AMB-002)","sales_billing_invoice table has no NULL sales_billing_to_invoice_type after each flush"],"example_table":[{"step":"after edit","inv_p_type":"direct_debit","displays":"direct_debit"},{"step":"after reassign + old master edit","inv_p_type":"detailed","displays":"detailed"},{"step":"after clear","inv_p_type":false,"displays":"blank"}]},{"ak_id":"AK-007","tc_id":"TC-Auto-INV-036","why":"Multi-step archive flow with post-action DB and export assertions against a captured baseline","prep":["Create master + billing + invoice INV-ARCH with a populated Invoice Type","Record the pre-change archive baseline for the identical flow (action outcome, post-archive visibility)"],"execution":["Execute the Invoice List archive action on INV-ARCH","search_read for INV-ARCH afterwards","download_excel the same dataset afterwards"],"assertions":["Archive action outcome equals the baseline (same success/failure and message set)","Post-archive search_read does not return INV-ARCH (matching baseline behavior)","Post-archive download contains no INV-ARCH row","No error or warning references Invoice Type or the new field"],"example_table":[{"step":"before archive","list_hits":1,"download_rows":1},{"step":"after archive","list_hits":0,"download_rows":0}]}],"coverage":{"reqs_without_tm":[],"tm_without_tc":[],"skipped_requirements":[],"conflicts_detected":[]},"heuristic_checklist":[{"hc_id":"HC-01","heuristic":"Numbers (Data Type Attacks)","status":"applied","evidence":"ID-CHECK-011 (column index adjacency, +1 exactly), ID-CHECK-016 (0/1/many option states), ID-CHECK-026 (0/1/many rows), TC-Auto-INV-031 volume sizing; no other numeric surface exists in this PRD"},{"hc_id":"HC-02","heuristic":"Strings (Data Type Attacks)","status":"applied","evidence":"Blank-vs-value edges (TC-Auto-INV-019, TC-Auto-INV-025) and multi-script label parity ja_JP (TC-Auto-INV-018); no free-text input surface exists (selection filter only)"},{"hc_id":"HC-03","heuristic":"Time & Date (Data Type Attacks)","status":"applied","evidence":"TC-Auto-INV-038 (TZ Asia/Tokyo vs UTC, TZ-invariant label), TC-Auto-INV-020 (read-edit-download ordering)"},{"hc_id":"HC-04","heuristic":"Paths/Files (Data Type Attacks)","status":"applied","evidence":"Download file integrity: TC-Auto-INV-008 (double download, well-formed workbook), TC-Auto-INV-012 (stable layout on repeat), TC-Auto-INV-009 (no partial file on session loss)"},{"hc_id":"HC-05","heuristic":"General (Data Type Attacks)","status":"applied","evidence":"Domain/uniqueness violations: foreign filter values never match (TC-Auto-INV-015), unauthorized access rejected (TC-Auto-INV-033)"},{"hc_id":"HC-06","heuristic":"Navigation (Web Tests)","status":"applied","evidence":"Refresh-after-search (TC-Auto-INV-003, TC-Auto-INV-022), refresh mid-configuration (TC-Auto-INV-029), back-to-flow after re-login (TC-Auto-INV-004, TC-Auto-INV-030)"},{"hc_id":"HC-07","heuristic":"Input (Web Tests)","status":"na","evidence":"No free-text or textarea input in scope: the Invoice Type filter is selection-based and the PRD adds no text entry (injection probes would test unchanged platform behavior)"},{"hc_id":"HC-08","heuristic":"Preferences (Web Tests)","status":"na","evidence":"PRD section 4.4 declares only Guest/Archive/Closing/Timezone/Performance as ambient concerns; JS-off/cookies-off and font/resize matrices are out of scope for a filter+column addition"},{"hc_id":"HC-09","heuristic":"Accessibility (Web Tests)","status":"deferred","evidence":"Keyboard operability and labeling of the new filter are designable but not verifiable now: FE repo unavailable (EX-001); redesign FE keyboard/focus TCs once the FE source is locatable"},{"hc_id":"HC-10","heuristic":"Seen and Heard (Ady Stokes)","status":"na","evidence":"No audio or screen-reader surface is part of this PRD; no audible content exists on the Invoice List"},{"hc_id":"HC-11","heuristic":"BINMEN (API Tests)","status":"applied","evidence":"Boundary (zero-match, TC-Auto-INV-002), Invalid (foreign values, TC-Auto-INV-015), NULL/Empty (blank type, TC-Auto-INV-019/025; empty result set, TC-Auto-INV-002); Method-verb variants are generic platform behavior untouched by RINGI-0151, excluded to avoid padding"},{"hc_id":"HC-12","heuristic":"POISED (API Tests)","status":"applied","evidence":"Parameters (domain variants, TC-Auto-INV-001/002), Output (file layout, TC-Auto-INV-010/011), Interop (locale labels, TC-Auto-INV-018), Security (TC-Auto-INV-032/033), Errors (zero-match, auth rejection), Data (0/1/many, TC-Auto-INV-016/026)"},{"hc_id":"HC-13","heuristic":"VADER (API Tests)","status":"applied","evidence":"Verbs (search_read/download_excel), authN/authZ (TC-Auto-INV-004/009/033), Data (locale and type variants), Errors (empty set, auth error), Responsiveness (TC-Auto-INV-031)"},{"hc_id":"HC-14","heuristic":"Mobile (Daniel Knott)","status":"na","evidence":"PRD and code cover the web admin Invoice List only; no mobile surface exists"},{"hc_id":"HC-15","heuristic":"Variable Analysis","status":"applied","evidence":"Enumerated before design: filter value, master type, master linkage, invoice count, locale, timezone, session state, actor type, request repetition, data volume — each varied in the matrix"},{"hc_id":"HC-16","heuristic":"TouchPoints","status":"applied","evidence":"Touchpoints enumerated in code sweep: /api/dataset/sales.billing.invoice/search_read, /download_excel, selection/options surface, billing.to.master, archive action, closing process, streaming export"},{"hc_id":"HC-17","heuristic":"Boundaries","status":"applied","evidence":"Adjacency approached and exact (TC-Auto-INV-010/011), zero-match at the empty boundary (TC-Auto-INV-002), first/last/all selection values (TC-Auto-INV-014)"},{"hc_id":"HC-18","heuristic":"Goldilocks","status":"applied","evidence":"Too small: 0 masters/0 invoices (TC-Auto-INV-016/026); just right: 1 row (TC-Auto-INV-011 single-row domain); too big: 10,000+ rows (TC-Auto-INV-031)"},{"hc_id":"HC-19","heuristic":"CRUD","status":"applied","evidence":"Read (list/download TCs), Update (master type edits TC-Auto-INV-017/027), Delete-equivalent (archive regression TC-Auto-INV-036); Create of invoices is prep-only — the PRD adds no create behavior"},{"hc_id":"HC-20","heuristic":"Follow the Data","status":"applied","evidence":"master -> billing -> invoice -> screen -> file chain verified at each step (TC-Auto-INV-017, TC-Auto-INV-020, TC-Auto-INV-027)"},{"hc_id":"HC-21","heuristic":"Count","status":"applied","evidence":"TC-Auto-INV-016 (0/1/many option values), TC-Auto-INV-026 (0/1/many invoice rows)"},{"hc_id":"HC-22","heuristic":"Selection","status":"applied","evidence":"Some (single filter value, TC-Auto-INV-001), none (zero-match, TC-Auto-INV-002), all (full value set, TC-Auto-INV-014)"},{"hc_id":"HC-23","heuristic":"Position","status":"applied","evidence":"Column position beginning/middle probing via exact adjacency and no-collateral-shift (TC-Auto-INV-010/011/012)"},{"hc_id":"HC-24","heuristic":"Dependencies","status":"applied","evidence":"billing.to.master -> sales.billing -> sales.billing.invoice tree walked with update/reassign/clear (TC-Auto-INV-027) and archive (TC-Auto-INV-036)"},{"hc_id":"HC-25","heuristic":"Constraints","status":"applied","evidence":"Required-blank analog (no-type master renders blank, TC-Auto-INV-025), invalid combinations (foreign filter values, TC-Auto-INV-015), scope constraint (List and Download only, TC-Auto-INV-007)"},{"hc_id":"HC-26","heuristic":"Input Method","status":"applied","evidence":"UI path (e2e select-in-dropdown: TC-Auto-INV-028/029) probed alongside direct API domain calls (TC-Auto-INV-001/002); depth limited by missing FE repo (EX-001)"},{"hc_id":"HC-27","heuristic":"Sequences","status":"applied","evidence":"Order varied: view-edit-download (TC-Auto-INV-020), edit-search (TC-Auto-INV-017), reassign-then-old-master-edit (TC-Auto-INV-027), repeat-search idempotence (TC-Auto-INV-003)"},{"hc_id":"HC-28","heuristic":"Sorting","status":"na","evidence":"PRD adds no sort behavior and changes no ordering; row ordering is unchanged list behavior guarded implicitly by the row-set equality assertions"},{"hc_id":"HC-29","heuristic":"Interruptions","status":"applied","evidence":"TC-Auto-INV-003/004 (search), 008/009 (download), 020 (mid-flow data change), 022/023 (view), 029/030 (filter configuration)"},{"hc_id":"HC-30","heuristic":"Starvation","status":"deferred","evidence":"Resource-starvation probes need a threshold or environment budget; PM waived numeric performance measurement (AMB-001 'No Need') and no load environment is specified"},{"hc_id":"HC-31","heuristic":"Configurations","status":"applied","evidence":"Locale configuration en/ja (TC-Auto-INV-018), timezone Asia/Tokyo/UTC (TC-Auto-INV-038)"},{"hc_id":"HC-32","heuristic":"Multi-User","status":"applied","evidence":"Two guest accounts, same resource, simultaneous (TC-Auto-INV-034)"},{"hc_id":"HC-33","heuristic":"Flood","status":"applied","evidence":"Rapid-fire guest requests (TC-Auto-INV-035), double download (TC-Auto-INV-008), 5x Search clicks (TC-Auto-INV-003/029)"},{"hc_id":"HC-34","heuristic":"State Analysis","status":"applied","evidence":"States mapped: master type set/edited/cleared, invoice masterless, session valid/expired, invoice active/archived, period open/closed (TC-Auto-INV-025/027/036/037, session TCs)"},{"hc_id":"HC-35","heuristic":"Map Making","status":"na","evidence":"Exploratory navigation aid, not a testable surface; base-state discipline is embedded in the seeded preconditions of every AK"},{"hc_id":"HC-36","heuristic":"Users & Scenarios / Seven Dwarfs / D&I","status":"applied","evidence":"Guest persona (TC-Auto-INV-032/034), unauthorized actor (TC-Auto-INV-033), impatient rapid-clicker (TC-Auto-INV-003/029/035), absent-minded refresher (TC-Auto-INV-022)"},{"hc_id":"HC-37","heuristic":"Wisdom: question per test","status":"applied","evidence":"All 38 matrix entries are single-question Able to / Not able to / Verify statements; each TC states the distinct information its failure would reveal"},{"hc_id":"HC-38","heuristic":"Wisdom: contrary approach","status":"applied","evidence":"Every positive has a violation: matching display vs zero-match (001/002), options present vs foreign values (013/015), value shown vs blank (024/025), download works vs session loss (006/009), no-change constraints attempted (036/037/038)"},{"hc_id":"HC-39","heuristic":"Wisdom: vary","status":"applied","evidence":"Sequences varied (TC-Auto-INV-017/020/027), configurations varied (018/038), data varied (014/016/026)"},{"hc_id":"HC-40","heuristic":"Judgement framework (Lyndsay)","status":"applied","evidence":"Absences/inconsistencies vs PRD recorded as EX-001..EX-005 (FE gap, label collision, options source, blank rendering, guest baseline) instead of being asserted as expected results"},{"hc_id":"HC-41","heuristic":"Wisdom: bugs cluster","status":"applied","evidence":"Deepened around two clusters: the Invoice-Type naming collision (EX-002 -> TC-Auto-INV-015 plus option TCs 013/014) and the FE/BE contract gap (EX-001/EX-003 -> e2e and options TCs)"},{"hc_id":"HC-42","heuristic":"RCRCRC (regression scope)","status":"applied","evidence":"Core (list/download happy paths), Risky (contract rename EX-002), Configuration-sensitive (locale/tz), all designed as baseline comparisons; no change-history doc exists, so Recent/Repaired items default to the branch's own ringi-0151 implementation notes"},{"hc_id":"HC-4     <script>
      (function () {
        "use strict";
        var S = window.__PRDTESTKIT__;
        if (!S) {
          document.body.innerHTML =
            "<p style='padding:20px'>Data payload missing — regenerate this page with the prd-testkit skill.</p>";
          return;
        }
        var TYPES = [
          "flow",
          "validation",
          "business-rule",
          "permission",
          "non-functional",
          "constraint",
        ];
        var editing = {};

        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined && text !== null) e.textContent = String(text);
          return e;
        }
        function chip(txt, extra) {
          return el("span", "chip " + (extra || ""), txt);
        }
        function txt(v) {
          return v === undefined || v === null ? "" : String(v);
        }
        function fmtList(arr) {
          return Array.isArray(arr) ? arr.join(", ") : txt(arr);
        }
        function dl(parent, label, value) {
          var dt = el("dt", null, label),
            dd = el("dd");
          dd.textContent = txt(value);
          dd.style.whiteSpace = "pre-wrap";
          parent.appendChild(dt);
          parent.appendChild(dd);
        }
        function btn(label, fn, cls) {
          var b = el("button", cls || "", label);
          b.type = "button";
          b.addEventListener("click", fn);
          return b;
        }

        function tableInto(wrap, headers, rows) {
          var t = document.createElement("table"),
            thead = document.createElement("thead"),
            tr = document.createElement("tr");
          headers.forEach(function (h) {
            tr.appendChild(el("th", null, h));
          });
          thead.appendChild(tr);
          t.appendChild(thead);
          var tb = document.createElement("tbody");
          rows.forEach(function (cells) {
            var r = document.createElement("tr");
            cells.forEach(function (c) {
              if (c) r.appendChild(c);
            });
            tb.appendChild(r);
          });
          t.appendChild(tb);
          wrap.appendChild(t);
          return t;
        }
        function tdText(v, cls) {
          return el("td", cls || "", txt(v));
        }
        function tdChips(list, cls) {
          var td = el("td");
          (list || []).forEach(function (v, i) {
            if (i) td.appendChild(document.createTextNode(" "));
            td.appendChild(chip(v, cls));
          });
          return td;
        }

        function escCsv(v) {
          v = txt(v).replace(/"/g, '""');
          return /[",\n]/.test(v) ? '"' + v + '"' : v;
        }
        function toCsv(headers, rows) {
          return (
            headers.map(escCsv).join(",") +
            "\n" +
            rows
              .map(function (r) {
                return r.map(escCsv).join(",");
              })
              .join("\n")
          );
        }
        function escTsv(v) {
          return txt(v).replace(/\t/g, " ").replace(/\r?\n/g, " ");
        }
        function toTsv(headers, rows) {
          return (
            headers.map(escTsv).join("\t") +
            "\n" +
            rows
              .map(function (r) {
                return r.map(escTsv).join("\t");
              })
              .join("\n")
          );
        }
        function copyText(text, btnEl) {
          function done() {
            if (btnEl) {
              var old = btnEl.textContent;
              btnEl.textContent = "Copied";
              setTimeout(function () {
                btnEl.textContent = old;
              }, 1400);
            }
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              done();
            } catch (e) {
              window.prompt("Copy manually:", text);
            }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
          } else fallback();
        }
        function download(name, content) {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([content], {type: "application/json"}),
          );
          a.download = name;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 500);
        }
        function copyBtns(getData) {
          var span = el("span");
          span.appendChild(
            btn("Copy CSV", function () {
              var d = getData();
              copyText(toCsv(d.headers, d.rows), this);
            }),
          );
          span.appendChild(document.createTextNode(" "));
          span.appendChild(
            btn("Copy Excel (TSV)", function () {
              var d = getData();
              copyText(toTsv(d.headers, d.rows), this);
            }),
          );
          return span;
        }

        // ---------- header / tabs ----------
        document.title = "Test Kit — " + S.prd_name;
        document.getElementById("hdr-name").textContent = S.prd_name;
        var hasDesign = !!(S.design && S.design.traceability_matrix);
        var metaLine = document.getElementById("hdr-meta");
        if (hasDesign) {
          metaLine.textContent =
            "requirements: " +
            S.requirements.requirements.length +
            " · checklist: " +
            S.design.traceability_matrix.length +
            " · cases: " +
            S.design.test_cases.length +
            " · answer keys: " +
            (S.design.answer_keys || []).length +
            " · generated " +
            ((S.design.meta && S.design.meta.generated_at) || "");
        } else {
          metaLine.textContent =
            S.docs_dir +
            " · requirements only (review stage) · " +
            ((S.requirements.meta &&
              S.requirements.meta.counts &&
              S.requirements.meta.counts.requirements) ||
              S.requirements.requirements.length) +
            " requirements";
        }
        var TABS = [["sec-req", "Requirement"]];
        if (hasDesign) {
          TABS.push(
            ["sec-tm", "Traceability Matrix"],
            ["sec-tc", "Test Cases"],
            ["sec-audit", "Audit"],
          );
        }
        var nav = document.getElementById("tabs");
        TABS.forEach(function (t, i) {
          var b = btn(t[1], function () {
            document.querySelectorAll("main > section").forEach(function (s) {
              s.classList.remove("on");
            });
            document.querySelectorAll("nav button").forEach(function (x) {
              x.classList.remove("on");
            });
            document.getElementById(t[0]).classList.add("on");
            b.classList.add("on");
          });
          if (i === 0) b.classList.add("on");
          nav.appendChild(b);
        });
        document.getElementById("sec-req").classList.add("on");

        // ---------- REQUIREMENTS ----------
        var reqWrap = document.getElementById("req-wrap"),
          reqBar = document.getElementById("req-bar");
        reqBar.appendChild(
          el(
            "span",
            "hint",
            "Edit inline, add or delete rows. No approval step: anything not deleted counts as approved. Save writes requirements.json.",
          ),
        );
        reqBar.appendChild(
          btn("+ Add requirement", function () {
            var n = maxReq() + 1,
              id = "REQ-" + pad(n);
            S.requirements.requirements.push({
              req_id: id,
              requirement: "",
              quote: "",
              section: "",
              type: "flow",
              testable: true,
            });
            editing[id] = true;
            renderReq();
          }),
        );
        reqBar.appendChild(copyBtns(reqTableData));
        function pad(n) {
          return (n < 10 ? "00" : "0") + n;
        }
        function maxReq() {
          var m = 0;
          S.requirements.requirements.forEach(function (r) {
            var n = parseInt((r.req_id || "").replace(/\D/g, ""), 10);
            if (n > m) m = n;
          });
          return m;
        }
        function reqTableData() {
          return {
            headers: ["REQ-ID", "Requirement", "Section", "Type", "Testable"],
            rows: S.requirements.requirements.map(function (r) {
              return [
                r.req_id,
                r.requirement,
                r.section,
                r.type,
                r.testable ? "Yes" : "No",
              ];
            }),
          };
        }
        function renderReq() {
          reqWrap.textContent = "";
          var rows = S.requirements.requirements.map(function (r) {
            var tr = [];
            if (editing[r.req_id]) {
              tr.push(tdText(r.req_id, "id"));
              var rq = el("td"),
                qa = document.createElement("textarea");
              qa.value = txt(r.requirement);
              rq.appendChild(qa);
              tr.push(rq);
              var sc = el("td"),
                si = document.createElement("input");
              si.value = txt(r.section);
              sc.appendChild(si);
              tr.push(sc);
              var ty = el("td"),
                sel = document.createElement("select");
              TYPES.forEach(function (t) {
                var o = document.createElement("option");
                o.value = t;
                o.textContent = t;
                if (r.type === t) o.selected = true;
                sel.appendChild(o);
              });
              ty.appendChild(sel);
              tr.push(ty);
              var tb = el("td"),
                sel2 = document.createElement("select");
              [
                ["yes", "Yes"],
                ["no", "No"],
              ].forEach(function (p) {
                var o = document.createElement("option");
                o.value = p[0];
                o.textContent = p[1];
                if ((r.testable ? "yes" : "no") === p[0]) o.selected = true;
                sel2.appendChild(o);
              });
              tb.appendChild(sel2);
              tr.push(tb);
              var act = el("td", "rowbtns");
              act.appendChild(
                btn("Save row", function () {
                  r.requirement = qa.value.trim();
                  r.section = si.value.trim();
                  r.type = sel.value;
                  r.testable = sel2.value === "yes";
                  delete editing[r.req_id];
                  renderReq();
                }),
              );
              act.appendChild(document.createTextNode(" "));
              act.appendChild(
                btn("Cancel", function () {
                  if (!txt(r.requirement).trim()) {
                    S.requirements.requirements =
                      S.requirements.requirements.filter(function (x) {
                        return x !== r;
                      });
                  }
                  delete editing[r.req_id];
                  renderReq();
                }),
              );
              tr.push(act);
            } else {
              tr.push(tdText(r.req_id, "id"));
              tr.push(tdText(r.requirement, "wide"));
              tr.push(tdText(r.section, "ctr"));
              var tc = el("td");
              tc.appendChild(chip(r.type, r.type));
              tr.push(tc);
              var tv = el("td");
              tv.appendChild(
                chip(r.testable ? "Yes" : "No", r.testable ? "yes" : "no"),
              );
              tr.push(tv);
              var act = el("td", "rowbtns");
              act.appendChild(
                btn("Edit", function () {
                  editing[r.req_id] = true;
                  renderReq();
                }),
              );
              act.appendChild(document.createTextNode(" "));
              act.appendChild(
                btn("Delete", function () {
                  if (confirm("Delete " + r.req_id + "?")) {
                    S.requirements.requirements =
                      S.requirements.requirements.filter(function (x) {
                        return x !== r;
                      });
                    renderReq();
                  }
                }),
              );
              tr.push(act);
            }
            return tr;
          });
          tableInto(
            reqWrap,
            ["REQ-ID", "Requirement", "Section", "Type", "Testable", ""],
            rows,
          );
        }
        renderReq();

        // ---------- AMBIGUITY LOG (answer editable) ----------
        var ambBar = document.getElementById("amb-bar"),
          ambWrap = document.getElementById("amb-wrap");
        var ambs = S.requirements.ambiguities || [];
        ambBar.appendChild(
          el("h2", "tab-title", "Ambiguity log (" + ambs.length + ")"),
        );
        if (ambs.length) {
          ambBar.appendChild(
            el(
              "span",
              "hint",
              "Fill the Answer column when the PM replies — a filled answer counts as confirmed specification for test design. Copy prompt brings the whole file to any LLM to update.",
            ),
          );
          ambBar.appendChild(copyBtns(ambTableData));
          ambBar.appendChild(
            btn("Copy LLM context (Ambiguities)", function () {
              copyText(llmContextAmb(), this);
            }),
          );
          var rows = ambs.map(function (a) {
            var an = el("td"),
              inp = document.createElement("input");
            inp.value = txt(a.answer);
            inp.placeholder = "—";
            inp.addEventListener("change", function () {
              a.answer = inp.value;
            });
            an.appendChild(inp);
            return [
              tdText(a.amb_id, "id"),
              tdText(fmtList(a.req_refs), "ctr"),
              tdText(a.kind, "ctr"),
              tdText(a.issue, "wide"),
              tdText(a.question, "wide"),
              an,
            ];
          });
          tableInto(
            ambWrap,
            [
              "AMB-ID",
              "REQ refs",
              "Kind",
              "Issue",
              "Question for PM",
              "Answer",
            ],
            rows,
          );
        } else {
          ambWrap.appendChild(el("p", "hint", "No ambiguities recorded."));
        }
        function ambTableData() {
          return {
            headers: [
              "AMB-ID",
              "REQ refs",
              "Kind",
              "Issue",
              "Question for PM",
              "Answer",
            ],
            rows: ambs.map(function (a) {
              return [
                a.amb_id,
                fmtList(a.req_refs),
                a.kind,
                a.issue,
                a.question,
                txt(a.answer),
              ];
            }),
          };
        }
        function llmContextAmb() {
          var head =
            'You are assisting a QA engineer maintaining the requirement ambiguities for "' +
            S.prd_name +
            '".\n' +
            "The artifact lives at " +
            S.docs_dir +
            "/requirements.json (schema: meta, requirements[], ambiguities[]; each ambiguity has kind, issue, question, answer).\n" +
            "Below is the current file. Apply the changes described after this block (e.g. fill answer fields from the PM's replies, update or add ambiguities), then output the COMPLETE updated requirements.json — valid JSON only, unchanged entries keep their IDs, answers never invented beyond what is given.\n\n";
          return (
            head + "```\n" + JSON.stringify(S.requirements, null, 2) + "\n```"
          );
        }

        // ---------- SAVE ----------
        document
          .getElementById("btn-save")
          .addEventListener("click", function () {
            var c = S.requirements.meta && S.requirements.meta.counts;
            if (c) {
              c.requirements = S.requirements.requirements.length;
              c.testable = S.requirements.requirements.filter(function (r) {
                return r.testable;
              }).length;
              c.not_testable = c.requirements - c.testable;
              c.ambiguities = (S.requirements.ambiguities || []).length;
            }
            var content = JSON.stringify(S.requirements, null, 2),
              st = document.getElementById("save-status");
            fetch("/save", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                filename: "requirements.json",
                content: content,
              }),
            })
              .then(function (r) {
                if (!r.ok) throw 0;
                return r.json();
              })
              .then(
                function () {
                  st.textContent =
                    "Saved to " + S.docs_dir + "/requirements.json";
                  st.style.color = "var(--ok)";
                },
                function () {
                  download("requirements.json", content);
                  st.textContent =
                    "Server not running — downloaded requirements.json; replace the file in " +
                    S.docs_dir +
                    "/";
                  st.style.color = "var(--warn)";
                },
              );
          });

        // ---------- TRACEABILITY MATRIX (grouped, Excel-merge style) ----------
        function tmRows() {
          return S.design.traceability_matrix.map(function (t) {
            return [
              t.tm_id,
              t.group_requirement || "",
              t.group_primary || "",
              t.group_secondary || "",
              t.group_tertiary || "",
              t.behaviour,
            ];
          });
        }
        function tmTableData() {
          var raw = tmRows(),
            out = [];
          raw.forEach(function (r, i) {
            out.push(
              r.map(function (v, col) {
                if (col === 0 || col === 5) return v; // ID + Checklist always shown
                return i > 0 && raw[i - 1][col] === v ? "" : v; // group columns: blank on continuation
              }),
            );
          });
          return {
            headers: [
              "Checklist ID",
              "Requirement",
              "Primary",
              "Secondary",
              "Tertiary",
              "Checklist",
            ],
            rows: out,
          };
        }
        function renderTm() {
          var wrap = document.getElementById("tm-wrap");
          wrap.textContent = "";
          var tms = S.design.traceability_matrix;
          var table = document.createElement("table"),
            thead = document.createElement("thead"),
            hr = document.createElement("tr");
          [
            "Checklist ID",
            "Requirement",
            "Primary",
            "Secondary",
            "Tertiary",
            "Checklist",
          ].forEach(function (h) {
            hr.appendChild(el("th", null, h));
          });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tb = document.createElement("tbody");
          var runs = [null, null, null, null]; // pending open td per group column (1..4)
          tms.forEach(function (t) {
            var tr = document.createElement("tr");
            tr.appendChild(tdText(t.tm_id, "id"));
            [
              t.group_requirement,
              t.group_primary,
              t.group_secondary,
              t.group_tertiary,
            ].forEach(function (v, idx) {
              if (runs[idx] && runs[idx].val === v) {
                runs[idx].n++;
              } else {
                if (runs[idx] && runs[idx].td)
                  runs[idx].td.rowSpan = runs[idx].n;
                var td = el("td", idx === 0 ? "grp" : "ctr", txt(v));
                runs[idx] = {val: v, n: 1, td: td};
                tr.appendChild(td);
              }
            });
            var cl = el("td", null, t.behaviour);
            if (t.change_expected) {
              cl.appendChild(document.createTextNode(" "));
              cl.appendChild(chip("change expected", "change"));
            }
            if (t.notes) {
              cl.title = t.notes;
            }
            tr.appendChild(cl);
            tb.appendChild(tr);
          });
          runs.forEach(function (r) {
            if (r && r.td) r.td.rowSpan = r.n;
          });
          table.appendChild(tb);
          wrap.appendChild(table);
        }
        function llmContextDesign() {
          var head =
            'You are assisting a QA engineer editing the test design for "' +
            S.prd_name +
            '".\n' +
            "The artifact lives at " +
            S.docs_dir +
            "/design.json (schema: meta, traceability_matrix, test_cases, answer_keys, coverage, heuristic_checklist). Ambiguity answers in the context are confirmed specification.\n" +
            "Below are the current traceability_matrix, test_cases, answer_keys arrays and the ambiguities with answers. Apply the changes described after this block, then output the COMPLETE updated design.json — valid JSON only, unchanged IDs for untouched entries, counts in meta kept consistent.\n\n";
          return (
            head +
            "```\n" +
            JSON.stringify(
              {
                traceability_matrix: S.design.traceability_matrix,
                test_cases: S.design.test_cases,
                answer_keys: S.design.answer_keys || [],
                ambiguities_with_answers: S.requirements.ambiguities || [],
              },
              null,
              2,
            ) +
            "\n```"
          );
        }

        // ---------- TEST CASES (filter by Type; copy excludes Type) ----------
        var tcFilter = "all";
        function tcVisible() {
          return S.design.test_cases.filter(function (t) {
            return tcFilter === "all" || t.layer === tcFilter;
          });
        }
        function tcTableData() {
          return {
            headers: ["Test Case ID", "Test Case Name"],
            rows: tcVisible().map(function (t) {
              return [t.tc_id, t.title];
            }),
          };
        }
        function renderTc() {
          var wrap = document.getElementById("tc-wrap");
          wrap.textContent = "";
          var bar = document.getElementById("tc-bar");
          bar.textContent = "";
          bar.appendChild(
            el(
              "span",
              "hint",
              (S.design.answer_keys || []).length +
                " answer keys — click Detail to view. Copy includes ID + Name only (Type excluded).",
            ),
          );
          var sel = document.createElement("select");
          sel.className = "filter";
          ["all", "e2e", "api-integration", "be-unit", "fe-unit"].forEach(
            function (v) {
              var o = document.createElement("option");
              o.value = v;
              o.textContent = v === "all" ? "Type: all" : v;
              if (tcFilter === v) o.selected = true;
              sel.appendChild(o);
            },
          );
          sel.addEventListener("change", function () {
            tcFilter = sel.value;
            renderTc();
          });
          bar.appendChild(sel);
          bar.appendChild(document.createTextNode(" "));
          bar.appendChild(copyBtns(tcTableData));
          bar.appendChild(
            btn("Copy LLM context (TM+TC)", function () {
              copyText(llmContextDesign(), this);
            }),
          );
          var rows = tcVisible().map(function (tc) {
            var act = el("td", "rowbtns");
            act.appendChild(
              btn("Detail", function () {
                openTcModal(tc);
              }),
            );
            return [
              tdText(tc.tc_id, "id"),
              tdText(tc.title, "wide"),
              tdText(tc.layer, "ctr"),
              act,
            ];
          });
          tableInto(wrap, ["Test Case ID", "Test Case Name", "Type", ""], rows);
        }

        if (hasDesign) {
          var tmBar = document.getElementById("tm-bar");
          tmBar.appendChild(
            el(
              "span",
              "hint",
              "Requirement breakdown — group columns merge like Excel (copy keeps the merge). " +
                S.design.traceability_matrix.filter(function (t) {
                  return t.change_expected;
                }).length +
                " entries expect code changes (safety-net tests).",
            ),
          );
          tmBar.appendChild(copyBtns(tmTableData));
          tmBar.appendChild(
            btn("Copy LLM context (TM+TC)", function () {
              copyText(llmContextDesign(), this);
            }),
          );
          renderTm();
          renderTc();

          // ---------- AUDIT ----------
          var aw = document.getElementById("audit-wrap");
          var hc = S.design.heuristic_checklist || [];
          var hcc =
            (S.design.meta &&
              S.design.meta.counts &&
              S.design.meta.counts.heuristic_checklist) ||
            {};
          aw.appendChild(
            el(
              "h2",
              "tab-title",
              "Heuristic self-audit — " +
                (hcc.applied || 0) +
                " applied / " +
                (hcc.na || 0) +
                " na / " +
                (hcc.deferred || 0) +
                " deferred",
            ),
          );
          aw.appendChild(
            el(
              "p",
              "hint",
              "Proof the design walked the full Test Heuristics Cheat Sheet. applied = designed (evidence links), na = surface absent, deferred = needs something (env, PM answer, git history).",
            ),
          );
          tableInto(
            aw,
            ["HC", "Heuristic", "Status", "Evidence"],
            hc.map(function (h) {
              var st = el("td");
              st.appendChild(chip(h.status, h.status));
              return [
                tdText(h.hc_id, "id"),
                tdText(h.heuristic),
                st,
                tdText(h.evidence, "wide"),
              ];
            }),
          );
          var cov = S.design.coverage || {},
            notes = [];
          (cov.tm_without_tc || []).forEach(function (x) {
            notes.push("Checklist without TC: " + x);
          });
          (cov.skipped_requirements || []).forEach(function (x) {
            notes.push("Skipped: " + x);
          });
          (cov.conflicts_detected || []).forEach(function (x) {
            notes.push("Conflict: " + x);
          });
          if (notes.length) {
            aw.appendChild(el("h2", "tab-title", "Coverage notes"));
            var ul = document.createElement("ul");
            notes.forEach(function (n) {
              ul.appendChild(el("li", null, n));
            });
            aw.appendChild(ul);
          }
        }

        // ---------- MODAL (TC detail + answer key) ----------
        var modal = document.getElementById("modal"),
          card = document.getElementById("modal-card");
        function closeModal() {
          modal.classList.remove("on");
        }
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });
        function openTcModal(tc) {
          card.textContent = "";
          var x = btn("×", closeModal);
          x.className = "close";
          x.style.fontSize = "18px";
          card.appendChild(x);
          card.appendChild(el("h2", null, tc.tc_id));
          card.appendChild(el("p", "sub", tc.title));
          card.appendChild(
            el(
              "p",
              "sub",
              tc.jenis +
                " · " +
                tc.priority +
                " · Type: " +
                tc.layer +
                " · Checklist: " +
                fmtList(tc.tm_ids) +
                " · REQ: " +
                fmtList(tc.req_ids),
            ),
          );
          var kv = el("dl", "kv");
          dl(kv, "Preconditions", fmtList(tc.preconditions));
          dl(kv, "Steps", fmtList(tc.steps));
          dl(kv, "Test data", JSON.stringify(tc.test_data || {}));
          dl(kv, "Expected result", tc.expected_result);
          dl(
            kv,
            "Automation candidate",
            tc.automation_candidate ? "yes" : "no",
          );
          if (tc.ambiguity_refs && tc.ambiguity_refs.length)
            dl(kv, "Ambiguity refs", fmtList(tc.ambiguity_refs));
          card.appendChild(kv);
          var ak = (S.design.answer_keys || []).filter(function (a) {
            return a.tc_id === tc.tc_id;
          })[0];
          if (ak) {
            card.appendChild(
              el(
                "h3",
                null,
                "Answer key — " + ak.ak_id + " (why: " + ak.why + ")",
              ),
            );
            var kv2 = el("dl", "kv");
            dl(kv2, "Preparation", fmtList(ak.prep));
            dl(kv2, "Execution", fmtList(ak.execution));
            card.appendChild(kv2);
            card.appendChild(el("h3", null, "Assertions"));
            var ul = document.createElement("ul");
            (ak.assertions || []).forEach(function (a) {
              ul.appendChild(el("li", null, a));
            });
            card.appendChild(ul);
            if (ak.example_table && ak.example_table.length) {
              card.appendChild(el("h3", null, "Example table"));
              var keys = [];
              ak.example_table.forEach(function (o) {
                Object.keys(o).forEach(function (k) {
                  if (keys.indexOf(k) < 0) keys.push(k);
                });
              });
              var tbl = tableInto(
                card,
                keys,
                ak.example_table.map(function (o) {
                  return keys.map(function (k) {
                    return tdText(JSON.stringify(o[k]));
                  });
                }),
              );
              tbl.className = "subtable";
            }
          } else {
            card.appendChild(
              el(
                "p",
                "hint",
                "No answer key for this case — its steps + expected result are the repro.",
              ),
            );
          }
          modal.classList.add("on");
        }
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeModal();
        });
      })();
    </script>
  </body>
</html>
