      host.appendChild(el('p', { class: 'subline', style: 'margin-top:8px', text: rows.length + ' of ' + tcs.length + ' cases · click a row for steps and data' }));
    }
    function detailRow(t, ak) {
      function block(lbl, node) { return el('div', {}, el('div', { class: 'd-lbl', text: lbl }), node); }
      return el('tr', { class: 'tc-detail' }, el('td', { colspan: 4 }, el('div', { class: 'detail' },
        block('Preconditions', el('ul', {}, (t.preconditions || []).map(function (p) { return el('li', { text: p }); }))),
        block('Steps', el('ol', {}, (t.steps || []).map(function (s) { return el('li', { text: s }); }))),
        block('Test data', el('pre', { text: t.test_data ? JSON.stringify(t.test_data, null, 2) : '—' })),
        block('Expected result', el('p', { style: 'margin:0', text: t.expected_result || '' })))));
    }
    function copyTc(fmt) {
      var esc = fmt === 'csv' ? csvCell : tsvCell;
      var out = [['ID', 'Title', 'TM IDs', 'Req IDs', 'Jenis', 'Priority', 'Layer', 'Automation', 'Preconditions', 'Steps', 'Test data', 'Expected result', 'Ambiguity refs']];
      visible().forEach(function (t) {
        out.push([t.tc_id, t.title, (t.tm_ids || []).join(' '), (t.req_ids || []).join(' '), t.jenis, t.priority, t.layer,
          t.automation_candidate ? 'yes' : 'no', (t.preconditions || []).join(' | '), (t.steps || []).join(' | '),
          t.test_data ? JSON.stringify(t.test_data) : '', t.expected_result, (t.ambiguity_refs || []).join(' ')]);
      });
      copyText(buildDelimited(out, fmt === 'csv' ? ',' : '\t', esc), 'test cases as ' + fmt.toUpperCase());
    }
    function copyTcConfluence() {
      var rows = visible();
      var out = ['# Test cases — ' + DATA.prd_name, '', '_' + rows.length + ' of ' + tcs.length + ' cases (current filter) · source: ' + DATA.docs_dir + '_', ''];
      rows.forEach(function (t) {
        var ak = akByTc[t.tc_id];
        out.push('## ' + t.tc_id + ' — ' + t.title);
        out.push('_' + [t.jenis, t.priority, t.layer, 'TM ' + (t.tm_ids || []).join(', '),
          'REQ ' + (t.req_ids || []).join(', '), t.automation_candidate ? 'automation' : '',
          (t.ambiguity_refs || []).length ? 'AMB ' + t.ambiguity_refs.join(',') : ''].filter(Boolean).join(' · ') + '_');
        out.push('');
        out.push('**Preconditions**');
        (t.preconditions || []).forEach(function (p) { out.push('- ' + p); });
        out.push('');
        out.push('**Steps**');
        (t.steps || []).forEach(function (s, i) { out.push((i + 1) + '. ' + s); });
        out.push('');
        if (t.test_data) {
          out.push('**Test data**');
          out.push('```');
          out.push(JSON.stringify(t.test_data, null, 2));
          out.push('```');
          out.push('');
        }
        out.push('**Expected result**');
        out.push(t.expected_result || '');
        if (ak) {
          out.push('');
          out.push('**Answer key ' + ak.ak_id + '**');
          akToText(ak).split('\n').forEach(function (l) {
            if (l.indexOf('## ') === 0) out.push('**' + l.slice(3) + '**');
            else out.push(l);
          });
        }
        out.push('');
      });
      copyText(out.join('\n'), 'the test cases as Confluence markdown');
    }
  }

  /* ---------- answer-key modal ---------- */
  function openAk(ak) {
    var root = $('#modal-root');
    root.textContent = '';
    function close() { root.textContent = ''; document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    var overlay = el('div', { class: 'overlay', onclick: function (e) { if (e.target === overlay) close(); } });
    var m = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': ak.ak_id });
    m.appendChild(el('div', { class: 'm-head' },
      el('div', {}, el('h2', { text: ak.ak_id + ' · ' + ak.tc_id }), el('p', { class: 'm-sub', text: ak.testcase_name })),
      el('div', { class: 'actions' },
        el('button', { class: 'btn', type: 'button', text: 'Copy answer key', onclick: function () { copyText(akToText(ak), ak.ak_id); } }),
        el('button', { class: 'btn btn-quiet', type: 'button', text: 'Close', onclick: close }))));
    m.appendChild(el('p', { class: 'm-sub', text: 'Expected: ' + ak.expected + ' · Result (executor fills, not saved here): ' + (ak.result || '—') }));
    (ak.sections || []).forEach(function (sec) {
      var s = el('div', { class: 'ak-section' }, el('h3', { text: sec.title }));
      if (sec.kv && sec.kv.length) {
        var kv = el('table', { class: 'kv' });
        sec.kv.forEach(function (pair) { kv.appendChild(el('tr', {}, el('td', { text: pair[0] }), el('td', { text: pair[1] }))); });
        s.appendChild(kv);
      }
      if (sec.table && sec.table.headers) {
        var t = el('table', { class: 'tbl', style: 'margin-top:8px' },
          el('thead', {}, el('tr', {}, sec.table.headers.map(function (h) { return el('th', { text: h }); }))));
        var tb = el('tbody');
        (sec.table.rows || []).forEach(function (r) { tb.appendChild(el('tr', {}, r.map(function (c) { return el('td', { text: c }); }))); });
        t.appendChild(tb);
        s.appendChild(t);
      }
      s.appendChild(el('p', { class: 'expect' }, el('span', { class: 'd-lbl', text: 'Expectation · ' }), sec.expectation));
      m.appendChild(s);
    });
    overlay.appendChild(m);
    root.appendChild(overlay);
    document.addEventListener('keydown', onKey);
  }
  function akToText(ak) {
    var lines = [ak.ak_id + ' · ' + ak.tc_id, ak.testcase_name, 'Expected: ' + ak.expected, 'Result:', ''];
    (ak.sections || []).forEach(function (sec) {
      lines.push('## ' + sec.title);
      (sec.kv || []).forEach(function (p) { lines.push(p[0] + '\t' + p[1]); });
      if (sec.table && sec.table.headers) {
        lines.push(sec.table.headers.join('\t'));
        (sec.table.rows || []).forEach(function (r) { lines.push(r.join('\t')); });
      }
      lines.push('Expectation: ' + sec.expectation, '');
    });
    return lines.join('\n');
  }

  /* ---------- view: audit ---------- */
  function viewAudit(root) {
    if (!S.design) return emptyDesign(root, 'The audit is generated by the test-design step.');
    var meta = S.design.meta || {};
    var counts = meta.counts || {};
    var tcs = S.design.test_cases || [];
    var coverage = S.design.coverage || {};

    root.appendChild(el('div', { class: 'title-row' },
      el('div', {},
        el('h1', { text: 'Audit' }),
        el('p', { class: 'subline', text: 'Design generated ' + (meta.generated_at || '—') + ' · code roots: BE ' + ((meta.code_roots && meta.code_roots.be) || 'not available') + ' · FE ' + ((meta.code_roots && meta.code_roots.fe) || 'not available') }))));

    root.appendChild(el('div', { class: 'strip' },
      el('div', { class: 'cell' }, el('div', { class: 'lbl', text: 'Requirements used' }), el('div', { class: 'val', text: String(counts.requirements_used || 0) })),
      el('div', { class: 'cell' }, el('div', { class: 'lbl', text: 'Matrix entries' }), el('div', { class: 'val', text: String(counts.matrix_entries || 0) })),
      el('div', { class: 'cell' }, el('div', { class: 'lbl', text: 'Test cases' }), el('div', { class: 'val', text: String(counts.test_cases || 0) })),
      el('div', { class: 'cell' }, el('div', { class: 'lbl', text: 'Answer keys' }), el('div', { class: 'val', text: String(counts.answer_keys || 0) }))));

    function miniTable(title, obj) {
      var tb = el('tbody');
      Object.keys(obj || {}).forEach(function (k) {
        var v = obj[k];
        if (Array.isArray(v)) v = v.length;
        tb.appendChild(el('tr', {}, el('td', { text: k }), el('td', { class: 'num mono', text: String(v) })));
      });
      return el('div', {},
        el('h2', { class: 'section', text: title }),
        el('div', { class: 'tablewrap' }, el('table', { class: 'tbl' }, tb)));
    }
    var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap)' },
      miniTable('By jenis', counts.by_jenis),
      miniTable('By priority', counts.by_priority),
      miniTable('By layer', counts.by_layer));
    root.appendChild(grid);

    var pending = tcs.filter(function (t) { return /\[oracle pending/i.test(t.expected_result || ''); });
    root.appendChild(el('h2', { class: 'section', text: 'Oracle pending' }, el('span', { class: 'section-meta', text: 'TCs whose pass threshold waits on an AMB answer' })));
    root.appendChild(pending.length
      ? el('ul', { class: 'listplain' }, pending.map(function (t) { return el('li', {}, monoSpan(t.tc_id), ' ' + t.title); }))
      : el('div', { class: 'empty', text: 'No oracle-pending cases.' }));

    root.appendChild(el('h2', { class: 'section', text: 'Conflicts detected' }));
    root.appendChild((coverage.conflicts_detected || []).length
      ? el('ul', { class: 'listplain' }, coverage.conflicts_detected.map(function (c) { return el('li', { text: c }); }))
      : el('div', { class: 'empty', text: 'No conflicts detected.' }));

    root.appendChild(el('h2', { class: 'section', text: 'Coverage orphans' }));
    var orphanBits = [];
    (coverage.reqs_without_tm || []).forEach(function (r) { orphanBits.push('REQ without TM: ' + r); });
    (coverage.tm_without_tc || []).forEach(function (r) { orphanBits.push('TM without TC: ' + r); });
    (coverage.skipped_requirements || []).forEach(function (r) { orphanBits.push('Skipped: ' + r); });
    root.appendChild(orphanBits.length
      ? el('ul', { class: 'listplain' }, orphanBits.map(function (b) { return el('li', { text: b }); }))
      : el('div', { class: 'empty', text: 'No coverage orphans.' }));

    var exList = meta.expected_changes || [];
    root.appendChild(el('h2', { class: 'section', text: 'Expected changes' }, el('span', { class: 'section-meta', text: 'where the code must move to meet the PRD' })));
    if (exList.length) {
      var tb = el('tbody');
      exList.forEach(function (x) {
        tb.appendChild(el('tr', {},
          el('td', { class: 'mono', text: x.id }),
          el('td', { class: 'mono', text: x.where }),
          el('td', { text: x.prd_says }),
          el('td', { text: x.code_shows }),
          el('td', { class: 'mono', text: (x.linked_tms || []).join(', ') })));
      });
      root.appendChild(el('div', { class: 'tablewrap' }, el('table', { class: 'tbl' },
        el('thead', {}, el('tr', {}, el('th', { text: 'ID' }), el('th', { text: 'Where' }), el('th', { text: 'PRD says' }), el('th', { text: 'Code shows' }), el('th', { text: 'Linked TMs' }))),
        tb)));
    } else root.appendChild(el('div', { class: 'empty', text: 'No expected changes recorded.' }));

    var hc = S.design.heuristic_checklist || [];
    root.appendChild(el('h2', { class: 'section', text: 'Heuristic checklist' }, el('span', { class: 'section-meta', text: (counts.heuristic_checklist ? counts.heuristic_checklist.applied + ' applied · ' + counts.heuristic_checklist.na + ' na · ' + counts.heuristic_checklist.deferred + ' deferred' : '') })));
    if (hc.length) {
      var htb = el('tbody');
      hc.forEach(function (h) {
        htb.appendChild(el('tr', {},
          el('td', { class: 'mono', text: h.hc_id }),
          el('td', { text: h.heuristic }),
          el('td', {}, pill(h.status, HC_TONE[h.status])),
          el('td', { text: h.evidence })));
      });
      root.appendChild(el('div', { class: 'tablewrap' }, el('table', { class: 'tbl' },
        el('thead', {}, el('tr', {}, el('th', { text: 'HC' }), el('th', { text: 'Heuristic' }), el('th', { text: 'Status' }), el('th', { text: 'Evidence' }))),
        htb)));
    } else root.appendChild(el('div', { class: 'empty', text: 'No checklist recorded.' }));
  }

  /* ---------- shell wiring ---------- */
  function renderNavCounts() {
    document.querySelectorAll('.nav-item .nav-count').forEach(function (n) { n.remove(); });
    if (!S.req) return;
    var open = openAmbCount();
    if (open > 0) {
      var reqBtn = document.querySelector('.nav-item[data-view="req"]');
      if (reqBtn) reqBtn.appendChild(pill(String(open), 'warning', open + ' unanswered ambiguities')).classList.add('nav-count');
    }
  }
  function mount() {
    var host = $('#view');
    host.textContent = '';
    var frag = document.createDocumentFragment();
    if (S.view === 'req') viewReq(frag);
    else if (S.view === 'tm') viewTm(frag);
    else if (S.view === 'tc') viewTc(frag);
    else viewAudit(frag);
    host.appendChild(frag);
    document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('is-active', b.dataset.view === S.view); });
    $('#sheet').scrollTop = 0;
  }
  function normalizeReq(req) {
    (req.requirements || []).forEach(function (r) { if (!('notes' in r)) r.notes = ''; });
    INPUT_BUCKETS.forEach(function (bucket) {
      if (!Array.isArray(req[bucket])) req[bucket] = [];
      req[bucket].forEach(function (item) { item.ai_analyzed = item.ai_analyzed === true; });
    });
    return req;
  }
  /* Refresh must show what was saved: when served, the live files win over the
     embedded snapshot; the embed stays the fallback for file:// use. */
  function initData(done) {
    var useEmbedded = function () {
      S.req = normalizeReq(JSON.parse(JSON.stringify(DATA.requirements || { meta: {}, requirements: [], ambiguities: [] })));
      S.design = DATA.design || null;
      done();
    };
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return useEmbedded();
    fetch('requirements.json', { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (json) {
        S.req = normalizeReq(json);
        fetch('design.json', { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : null; })
          .catch(function () { return null; })
          .then(function (design) { S.design = design || DATA.design || null; done(); });
      })
      .catch(useEmbedded);
  }
  function init() {
    var nav = $('#navlist');
    VIEWS.forEach(function (v) {
      nav.appendChild(el('button', { class: 'nav-item', type: 'button', 'data-view': v.id, title: v.label, onclick: function () { S.view = v.id; mount(); } },
        navIcon(v.icon), el('span', { class: 'nav-lbl', text: v.label })));
    });
    $('#nav-toggle').addEventListener('click', function () {
      var collapsed = $('#app').classList.toggle('nav-collapsed');
      this.setAttribute('aria-label', collapsed ? 'Expand navigation' : 'Collapse navigation');
      this.title = collapsed ? 'Expand navigation' : 'Collapse navigation';
      try { localStorage.setItem('ptk-nav', collapsed ? 'collapsed' : 'open'); } catch (e) { /* file:// or blocked storage */ }
    });
    try { if (localStorage.getItem('ptk-nav') === 'collapsed') $('#app').classList.add('nav-collapsed'); } catch (e) { /* ignore */ }
    if (!DATA) {
      $('#view').appendChild(el('div', { class: 'empty', text: 'No payload embedded. Render this page through the prd-testkit skill (assets/template.html).' }));
      $('#btn-save').disabled = true;
      return;
    }
    document.title = DATA.prd_name + ' — PRD Test Kit';
    $('#crumb').textContent = DATA.docs_dir;
    $('#nav-foot').textContent = DATA.prd_name;
    if (location.protocol === 'file:') {
      $('#serve-cmd').textContent = 'python3 .agents/skills/prd-testkit/scripts/serve.py ' + DATA.docs_dir + ' 8765';
      $('#serve-url').textContent = 'http://127.0.0.1:8765/index.html';
      $('#serve-banner').hidden = false;
    }
    $('#btn-save').addEventListener('click', save);
    initData(function () { renderNavCounts(); mount(); });
  }
  init();
})();
</script>
